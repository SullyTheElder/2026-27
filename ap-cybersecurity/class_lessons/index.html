<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AP Cybersecurity — Class Lessons</title>
<style>
  :root{ --navy:#0B1F3A; --navy-2:#123058; --green:#8FC53E; --cream:#F4F1E9; }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:linear-gradient(180deg,var(--navy) 0%, var(--navy-2) 100%); color:var(--cream);
    min-height:100vh; padding:48px 24px; }
  .wrap{max-width:900px;margin:0 auto;}
  .crumb{font-size:13px;color:rgba(244,241,233,.55);margin-bottom:14px;}
  .crumb a{color:var(--green);text-decoration:none;}
  h1{font-family:'Space Grotesk','Inter',sans-serif;font-size:30px;margin:0 0 10px;}
  .sub{color:rgba(244,241,233,.6);font-size:13.5px;margin-bottom:28px;}
  .unit-label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--green);
    font-weight:700;margin:24px 0 10px;}
  .list{display:flex;flex-direction:column;gap:10px;}
  .card{ display:block;text-decoration:none;color:inherit;
    background:rgba(244,241,233,.04); border:1px solid rgba(244,241,233,.14);
    border-radius:10px; padding:16px 20px;
    transition:border-color .15s ease, background .15s ease; }
  .card:hover{border-color:var(--green);background:rgba(143,197,62,.08);}
  .card h2{font-family:'Space Grotesk','Inter',sans-serif;font-size:16px;margin:0;}
  .empty{color:rgba(244,241,233,.45);font-size:14px;padding:20px 0;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="crumb"><a href="../../">Class Resources</a> / <a href="../">AP Cybersecurity</a> / Class Lessons</div>
    <h1>Class Lessons</h1>
    <p class="sub">Add new lessons by editing the LESSONS list at the bottom of this file's source, or just drop a folder + link in directly.</p>
    <div id="output"></div>
  </div>

<script>
  // Add one entry per lesson/tool. `unit` groups items under a heading (optional).
  const LESSONS = [
    
  ];

  const out = document.getElementById('output');
  if (LESSONS.length === 0) {
    out.innerHTML = '<p class="empty">No lessons posted yet — check back soon.</p>';
  } else {
    let html = '';
    let lastUnit = null;
    for (const item of LESSONS) {
      if (item.unit !== lastUnit) {
        if (lastUnit !== null) html += '</div>';
        html += `<div class="unit-label">${item.unit}</div><div class="list">`;
        lastUnit = item.unit;
      }
      html += `<a class="card" href="${item.path}"><h2>${item.title}</h2></a>`;
    }
    html += '</div>';
    out.innerHTML = html;
  }
</script>
</body>
</html>
