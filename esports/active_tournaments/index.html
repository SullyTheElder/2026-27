<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Active Tournaments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/esports/style.css">
</head>
<body>
  <!-- Full list, every status. esports/index.html reads the same
       tournaments.js and shows only the "active" ones directly on the
       landing page -- this page is the complete reference. -->
  <div class="bd-chevron"></div>
  <div class="wrap">
    <div class="crumb"><a href="../../">Class Resources</a> / <a href="../">Esports</a> / Active Tournaments</div>
    <h1>Active Tournaments</h1>
    <div class="grid" id="tournamentGrid"></div>
  </div>

<script src="/esports/active_tournaments/tournaments.js"></script>
<script>
  const STATUS_LABEL = { active: 'Active', upcoming: 'Upcoming', archived: 'Archived' };
  const grid = document.getElementById('tournamentGrid');
  if (!TOURNAMENTS.length) {
    grid.innerHTML = '<p>No tournaments posted yet — check back soon.</p>';
  } else {
    TOURNAMENTS.forEach(t => {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = t.path;
      a.innerHTML = '<h2>' + t.title + ' &rarr; <span class="bd-unit-chip">' +
        (STATUS_LABEL[t.status] || t.status) + '</span></h2><p>' + t.description + '</p>';
      grid.appendChild(a);
    });
  }
</script>
</body>
</html>
