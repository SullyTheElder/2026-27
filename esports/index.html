<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/esports/style.css">
</head>
<body>
  <div class="bd-chevron"></div>
  <div class="wrap">
    <div class="crumb"><a href="../">Class Resources</a> / Esports</div>
    <h1><span class="bd-word-green">Le Grand</span> <span class="bd-word-gold">Bulldog</span> Esports</h1>
    <h2>Active Tournaments</h2>
    <div class="grid" id="tournamentGrid"></div>
    <div class="crumb"><a href="active_tournaments/">See all tournaments, including upcoming &amp; archived &rarr;</a></div>
  </div>

<script src="/esports/active_tournaments/tournaments.js"></script>
<script>
  const grid = document.getElementById('tournamentGrid');
  const active = TOURNAMENTS.filter(t => t.status === 'active');
  if (!active.length) {
    grid.innerHTML = '<p>No tournaments are currently active — check back soon.</p>';
  } else {
    active.forEach(t => {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = 'active_tournaments/' + t.path;
      a.innerHTML = '<h2>' + t.title + ' &rarr;</h2><p>' + t.description + '</p>';
      grid.appendChild(a);
    });
  }
</script>
</body>
</html>
