<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esports</title>
<style>
  :root{ --navy:#0B1F3A; --navy-2:#123058; --green:#8FC53E; --cream:#F4F1E9; }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:linear-gradient(180deg,var(--navy) 0%, var(--navy-2) 100%); color:var(--cream);
    min-height:100vh; padding:48px 24px; }
  .wrap{max-width:900px;margin:0 auto;}
  .crumb{font-size:13px;color:rgba(244,241,233,.55);margin-bottom:14px;}
  .crumb a{color:var(--green);text-decoration:none;}
  h1{font-family:'Space Grotesk','Inter',sans-serif;font-size:30px;margin:0 0 28px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:640px){.grid{grid-template-columns:1fr;}}
  .card{ display:block;text-decoration:none;color:inherit;
    background:rgba(244,241,233,.04); border:1px solid rgba(244,241,233,.14);
    border-radius:10px; padding:22px 24px;
    transition:border-color .15s ease, background .15s ease, transform .15s ease; }
  .card:hover{border-color:var(--green);background:rgba(143,197,62,.08);transform:translateY(-1px);}
  .card h2{font-family:'Space Grotesk','Inter',sans-serif;font-size:18px;margin:0 0 6px;}
  .card p{margin:0;font-size:13.5px;color:rgba(244,241,233,.6);}
</style>
</head>
<body>
  <div class="wrap">
    <div class="crumb"><a href="../">Class Resources</a> / Esports</div>
    <h1>Esports</h1>
    <div class="grid">
      <a class="card" href="class_lessons/">
        <h2>Class Lessons &rarr;</h2>
        <p>Unit-by-unit lessons, tools, and interactive resources.</p>
      </a>
    </div>
  </div>
</body>
</html>
