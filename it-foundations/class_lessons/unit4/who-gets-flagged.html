<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who Gets Flagged — Unit 4, Lesson 6</title>
<style>
:root{--navy:#0F2238;--navy2:#1B3553;--teal:#14907F;--teal-d:#0C6B5E;--mint:#CDEFE4;--amber:#F2B134;--amber-d:#A86F08;--coral:#E8604C;--coral-l:#FCE4DF;--bg:#EEF3F7;--line:#C9D5E0;--sub:#475C72;--ok:#0C6B5E}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Calibri,Carlito,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--navy);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Cambria,Caladea,Georgia,serif;margin:0;line-height:1.15}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* both languages always visible; toggle swaps which is primary */
.bi{display:flex;flex-direction:column}
.bi.inline{display:inline-flex;vertical-align:top}
body[data-lang="en"] .bi .en{order:1;font-weight:700}
body[data-lang="en"] .bi .es{order:2;font-style:italic;font-weight:400;font-size:.86em;color:var(--sub)}
body[data-lang="es"] .bi .es{order:1;font-weight:700}
body[data-lang="es"] .bi .en{order:2;font-style:italic;font-weight:400;font-size:.86em;color:var(--sub)}
.on-dark .bi .en,.on-dark .bi .es{color:#fff}
body[data-lang="en"] .on-dark .bi .es,body[data-lang="es"] .on-dark .bi .en{color:#BCD0E2}
.btn .bi{align-items:center;text-align:center}
.btn .bi .en,.btn .bi .es{color:inherit !important}

header{background:var(--navy);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header .back{color:#BCD0E2;text-decoration:none;font-size:15px;border:1px solid #3B5675;padding:6px 10px;border-radius:6px}
header .ttl{flex:1;min-width:180px}
header h1{font-size:26px}
header .sub{font-size:14px;color:#BCD0E2}
.langtog{display:flex;border:1px solid #3B5675;border-radius:8px;overflow:hidden}
.langtog button{background:transparent;color:#BCD0E2;border:0;padding:7px 14px;font-weight:700}
.langtog button[aria-pressed="true"]{background:var(--teal);color:#fff}
main{max-width:1000px;margin:0 auto;padding:16px 16px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:16px}
.card h2{font-size:23px;margin-bottom:8px}
.lead{font-size:18px;margin:0}
.muted{color:var(--sub)}
.stepper{display:flex;gap:6px;flex-wrap:wrap;list-style:none;padding:0;margin:14px 0 0}
.stepper li{flex:1 1 90px;min-width:84px;border-top:5px solid var(--line);padding-top:5px;font-size:13px;color:var(--sub)}
.stepper li.done{border-color:var(--teal);color:var(--teal-d)}
.stepper li.now{border-color:var(--amber);color:var(--navy)}
.stepper .bi .en,.stepper .bi .es{font-size:13px !important}
.btn{border:0;border-radius:10px;padding:11px 20px;background:var(--teal);color:#fff;min-height:48px}
.btn:hover:not(:disabled){background:var(--teal-d)}
.btn:disabled{background:#B8C6D2;color:#fff;cursor:not-allowed}
.btn.alt{background:var(--navy)}
.btn.alt:hover:not(:disabled){background:var(--navy2)}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn.amber{background:var(--amber);color:var(--navy)}
.btn.amber:hover:not(:disabled){background:#E09E1C}
.btn.amber:disabled{background:#B8C6D2;color:#fff}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hero{background:var(--navy);color:#fff;border-radius:12px;padding:26px 22px;margin-top:16px}
.hero h2{font-size:34px;margin-bottom:10px;color:#fff}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:16px}
.how>div{background:var(--navy2);border-radius:10px;padding:12px 14px}
.how .n{font-family:Cambria,Caladea,Georgia,serif;font-size:26px;color:var(--amber);display:block}
label.f{display:block;margin-top:14px}
label.f .bi{margin-bottom:4px}
input[type=text],textarea{width:100%;border:2px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;min-height:46px}
input[type=text]:focus,textarea:focus{border-color:var(--teal)}
textarea{min-height:120px;resize:vertical}
.fields{display:grid;grid-template-columns:2fr 1fr;gap:12px;max-width:520px}
@media (max-width:620px){.fields{grid-template-columns:1fr}}
.msg.good{color:var(--ok)}
.msg.warn{color:#8A3A00}

/* Part 1: number game */
.guessrow{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.guessrow .gin{width:170px}
.guessrow input{font-size:28px;text-align:center;font-weight:700}
.fb{min-height:64px;margin:12px 0;font-size:20px}
.fb .big{font-family:Cambria,Caladea,Georgia,serif;font-size:30px;font-weight:700}
.fb.up .big{color:var(--teal-d)}
.fb.down .big{color:#9A3412}
.fb.win .big{color:var(--ok)}
.log{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.log li{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.log li.dup{background:var(--coral-l);border-color:var(--coral)}
.log .tag{font-size:12px;font-weight:700;color:#A12C1B}
.rangebar{position:relative;height:30px;background:#fff;border:2px solid var(--navy);border-radius:8px;overflow:hidden;margin:6px 0}
.rangebar .fill{position:absolute;top:0;bottom:0;background:var(--mint);border-left:3px solid var(--teal);border-right:3px solid var(--teal)}
.rangelab{display:flex;justify-content:space-between;font-size:14px;color:var(--sub)}

/* Part 2: card wall */
.target{display:inline-flex;align-items:baseline;gap:10px;background:var(--navy);color:#fff;border-radius:10px;padding:8px 16px}
.target .num{font-family:Cambria,Caladea,Georgia,serif;font-size:34px;font-weight:700;color:var(--amber)}
.wall{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:12px}
@media (max-width:620px){.wall{grid-template-columns:repeat(4,1fr)}}
.tile{aspect-ratio:1/1.1;min-height:56px;border-radius:10px;border:3px solid var(--navy);font-family:Cambria,Caladea,Georgia,serif;font-weight:700;font-size:22px;display:flex;align-items:center;justify-content:center;padding:0}
.tile.down{background:var(--amber);box-shadow:0 3px 0 var(--amber-d);color:var(--navy)}
.tile.down:hover:not(:disabled){transform:translateY(-2px)}
.tile.down .pos{font-size:16px;background:#fff;border:2px solid var(--navy);border-radius:6px;min-width:30px;padding:0 4px}
.tile.up{background:#fff;color:var(--navy)}
.tile.up.found{background:var(--mint);border-color:var(--teal);outline:4px solid var(--teal)}
.tile.up.bad{border-color:var(--coral)}
.tile.rev{background:#F6F9FB;color:var(--sub);border-style:dashed;border-color:var(--line)}
.tile:disabled{cursor:default}
.tilepos{display:block;font-size:11px;font-weight:400;color:var(--sub);font-family:Calibri,Carlito,sans-serif}

/* results */
.result{border:3px solid var(--teal)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:10px 0}
.stat{background:var(--bg);border-radius:10px;padding:10px 14px}
.stat .big{font-family:Cambria,Caladea,Georgia,serif;font-size:34px;font-weight:700;display:block;line-height:1.1}
.bars{margin-top:8px}
.bar{display:grid;grid-template-columns:minmax(150px,240px) 1fr 40px;gap:10px;align-items:center;margin:6px 0}
.bar .track{background:var(--bg);border-radius:6px;height:20px;overflow:hidden}
.bar .fill{height:100%;border-radius:6px}
.bar .num{font-weight:700;text-align:right}
@media (max-width:560px){.bar{grid-template-columns:1fr 1fr 34px}}
.strats{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:10px}
.strat{text-align:left;background:#fff;border:3px solid var(--line);border-radius:12px;padding:12px 14px}
.strat:hover{border-color:var(--teal)}
.strat[aria-pressed="true"]{border-color:var(--teal);background:var(--mint)}
.strat .h{font-family:Cambria,Caladea,Georgia,serif;font-size:19px;margin-bottom:4px}
.strat .bi .en,.strat .bi .es{font-weight:400}
body[data-lang="en"] .strat .bi .en{font-weight:600}
body[data-lang="es"] .strat .bi .es{font-weight:600}
body[data-lang="en"] .strat .h .bi .en,body[data-lang="es"] .strat .h .bi .es{font-weight:700}
.sumbox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;min-height:240px;background:#F6F9FB}
.copied{color:var(--ok);font-weight:700}
.challenge{border:3px dashed var(--amber)}
.reset{background:none;border:0;color:var(--sub);text-decoration:underline;font-size:14px;margin-top:22px}

/* ---- Build a Feed ---- */
.persona{background:var(--mint);border-radius:12px;padding:14px 16px;margin-top:12px}
.sliders{display:flex;flex-direction:column;gap:14px}
.sl{border-bottom:1px solid var(--line);padding-bottom:12px}
.sl:last-child{border-bottom:0}
.sl .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sl output{font-family:Cambria,Caladea,Georgia,serif;font-size:26px;font-weight:700;color:var(--teal-d);min-width:28px;text-align:right}
.sl input[type=range]{width:100%;accent-color:#14907F;height:34px}
.sl .hint{font-size:14px;color:var(--sub)}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.layout{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.meter{background:var(--navy);color:#fff;border-radius:12px;padding:12px 16px;margin-bottom:12px}
.meter .big{font-family:Cambria,Caladea,Georgia,serif;font-size:38px;font-weight:700;color:var(--amber);line-height:1}
.meter .goal{height:14px;background:#2B476A;border-radius:7px;position:relative;margin-top:8px;overflow:hidden}
.meter .goal .bar{position:absolute;left:0;top:0;bottom:0;background:var(--amber);border-radius:7px}
.meter .goal .line{position:absolute;top:-2px;bottom:-2px;width:3px;background:#fff}
.meter.win .big{color:#7CE8C9}
.meter.win .goal .bar{background:#7CE8C9}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.post{display:grid;grid-template-columns:38px 1fr 54px;gap:10px;align-items:start;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.post.in{border-color:var(--teal);background:#F7FCFA}
.post.out{opacity:.62}
.post.wanted{box-shadow:inset 6px 0 0 var(--teal)}
.post .rank{font-family:Cambria,Caladea,Georgia,serif;font-size:24px;font-weight:700;color:var(--navy2)}
.post .who{font-size:14px;color:var(--sub);margin-bottom:2px}
.post .txt{font-size:16px}
.post .txt .bi .en,.post .txt .bi .es{font-weight:400}
body[data-lang="en"] .post .txt .bi .en{font-weight:600}
body[data-lang="es"] .post .txt .bi .es{font-weight:600}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.bdg{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--bg);color:var(--navy2);font-weight:600}
.bdg.hot{background:var(--coral-l);border-color:var(--coral);color:#8A2A1A}
.bdg.ad{background:#FFF3D6;border-color:var(--amber);color:#7A5200}
.delta{font-weight:700;font-size:15px;text-align:right}
.delta.up{color:var(--teal-d)} .delta.down{color:#9A3412}
.cut{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:14px;margin:4px 0}
.cut:before,.cut:after{content:"";flex:1;border-top:3px dashed var(--coral)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:860px){.cols2{grid-template-columns:1fr}}
.wlist{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.wlist>span{display:inline-flex;gap:6px;align-items:baseline;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:14px;font-weight:700}
.poll{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:10px}
.poll button{text-align:left;background:#fff;border:3px solid var(--line);border-radius:12px;padding:10px 14px}
.poll button:hover{border-color:var(--teal)}
.poll button[aria-pressed="true"]{border-color:var(--teal);background:var(--mint)}


/* ---- Who Gets Flagged ---- */
.grp{margin-top:10px}
.grp h4{margin:0 0 6px;font-family:Cambria,Caladea,Georgia,serif;font-size:17px;color:var(--navy2)}
.tiles{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
@media (max-width:620px){.tiles{grid-template-columns:repeat(5,1fr)}}
.tile2{position:relative;border:2px solid var(--line);background:#fff;border-radius:8px;padding:6px 0;font-size:13px;font-weight:700;color:var(--sub);min-height:44px}
.tile2.flag{background:var(--amber);border-color:var(--navy);color:var(--navy);box-shadow:0 2px 0 var(--amber-d)}
.tile2.sel{outline:4px solid var(--teal);outline-offset:1px}
.tile2.need:after{content:"●";position:absolute;right:4px;top:0;color:#0C6B5E;font-size:14px}
.tile2.fa{border-color:var(--coral);background:var(--coral-l);color:#8A2A1A}
.tile2.miss{border-style:dashed;border-color:var(--teal)}
.legend2{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:14px;margin-top:10px;color:var(--sub)}
.legend2 i{display:inline-block;width:14px;height:14px;border-radius:4px;border:2px solid var(--navy);vertical-align:-2px;margin-right:5px}
.inspect{background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:10px;min-height:64px}
.m3{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:8px}
.m3>div{background:#1B3553;border-radius:8px;padding:6px 10px}
.m3 .v{font-family:Cambria,Caladea,Georgia,serif;font-size:26px;font-weight:700;color:var(--amber);line-height:1.1}
.m3 .l{font-size:12px;color:#BCD0E2}
.m3 .ok .v{color:#7CE8C9}
.chk{font-size:15px;margin-top:8px}

@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>

<main id="app"></main>
<div id="live" class="sr" aria-live="polite"></div>
<script>
(function(){
'use strict';
/* ===== tiny dependency-free PDF writer (Helvetica, WinAnsi, vector shapes) ===== */
const PDFLIB=(function(){
  const R=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,
    667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,
    556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
  const BD=[278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,
    722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,
    556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584];
  const MAP={'\u2018':0x91,'\u2019':0x92,'\u201C':0x93,'\u201D':0x94,'\u2013':0x96,'\u2014':0x97,'\u2026':0x85,'\u2022':0x95};
  function cw(ch,font){
    let c=ch.codePointAt(0);
    if(c<32||c>126){ if(ch==='\u00BF') c=63; else if(ch==='\u00A1') c=33; else { const b=ch.normalize('NFD')[0].codePointAt(0); c=(b>=32&&b<=126)?b:110; } }
    const tab=font==='F2'?BD:R; return (tab[c-32]||556)/1000;
  }
  function sw(s,font,size){let w=0; for(const ch of s) w+=cw(ch,font); return w*size;}
  function enc(s){
    let o=''; s=String(s).normalize('NFC');
    for(const ch of s){
      let c=ch.codePointAt(0);
      if(MAP[ch]) c=MAP[ch]; else if(c>255) c=63;
      if(c===40||c===41||c===92) o+='\\'+String.fromCharCode(c);
      else if(c<32) o+=' ';
      else if(c>126) o+='\\'+c.toString(8).padStart(3,'0');
      else o+=String.fromCharCode(c);
    } return o;
  }
  function wrap(s,font,size,maxW){
    const out=[];
    String(s).split(/\r?\n/).forEach(par=>{
      let line='';
      par.split(/\s+/).filter(Boolean).forEach(w0=>{
        let w=w0;
        while(sw(w,font,size)>maxW){            // break very long words
          let k=1; while(k<w.length&&sw(w.slice(0,k+1),font,size)<=maxW) k++;
          if(line){out.push(line); line='';}
          out.push(w.slice(0,k)); w=w.slice(k);
        }
        const t=line?line+' '+w:w;
        if(sw(t,font,size)<=maxW) line=t; else {out.push(line); line=w;}
      });
      out.push(line);
    });
    return out;
  }
  const NAVY=[0.059,0.133,0.22], TEAL=[0.047,0.42,0.369], GRAY=[0.28,0.36,0.45], MINT=[0.804,0.937,0.894], AMBER=[0.992,0.941,0.816], WHITE=[1,1,1];
  function doc(){
    const W=612,H=792,M=54; const pages=[]; let cur=null; let y=M;
    const f=n=>(Math.round(n*100)/100).toString();
    const col=(c,s)=>`${f(c[0])} ${f(c[1])} ${f(c[2])} ${s?'RG':'rg'}\n`;
    const d={W,H,M};
    d.newPage=()=>{ if(cur!==null) pages.push(cur); cur=''; y=M; };
    d.y=()=>y; d.setY=v=>{y=v;};
    d.ensure=h=>{ if(cur===null||y+h>H-M) d.newPage(); };
    d.text=(s,x,base,font,size,c)=>{ cur+=col(c||NAVY,false)+`BT /${font} ${size} Tf ${f(x)} ${f(H-base)} Td (${enc(s)}) Tj ET\n`; };
    d.textC=(s,cx,base,font,size,c)=>{ d.text(s,cx-sw(s,font,size)/2,base,font,size,c); };
    d.title=(en,sub)=>{ d.ensure(60); d.text(en,M,y+20,'F2',22,NAVY); d.text(sub,M,y+38,'F3',11,GRAY); y+=54; };
    d.kv=(k,v)=>{ d.ensure(18); d.text(k+':',M,y+11,'F2',11,NAVY); const lines=wrap(v,'F1',11,W-2*M-150);
      lines.forEach((l,i)=>{ if(i>0) d.ensure(15); d.text(l,M+150,y+11,'F1',11,NAVY); y+=15; }); if(!lines.length) y+=15; };
    d.gap=n=>{y+=n;};
    d.heading=(en,es)=>{ d.ensure(52); y+=10; d.text(en,M,y+12,'F2',13,TEAL); d.text(es,M,y+26,'F3',10.5,GRAY);
      cur+=col(TEAL,true)+`0.8 w ${M} ${f(H-(y+31))} m ${W-M} ${f(H-(y+31))} l S\n`; y+=40; };
    d.para=(s,o)=>{ o=o||{}; const size=o.size||11, font=o.font||'F1', lead=size*1.35, w=W-2*M-(o.indent||0);
      wrap(s,font,size,w).forEach(l=>{ d.ensure(lead+2); d.text(l,M+(o.indent||0),y+size,font,size,o.color||NAVY); y+=lead; }); y+=4; };
    d.line=(s,o)=>d.para(s,o);
    /* ---- shapes (top-left coordinates) ---- */
    function rr(x,top,w,h,r){const k=0.5523*r,X=x,Y=H-top;

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const SEEDS=[1, 12, 18, 22, 25, 27, 28, 37, 43, 45, 46, 47, 53, 62, 64, 67, 69, 73, 78, 82, 89, 90, 91, 93, 95, 96, 101, 106, 114, 116, 130, 133, 138, 139, 140, 141, 143, 144, 149, 151, 152, 153, 157, 158, 159, 167, 168, 169, 171, 182, 190, 195, 196, 205, 210, 211, 219, 220, 221, 223, 225, 229, 233, 235, 245, 247, 257, 262, 266, 269, 273, 275, 276, 281, 283, 288, 295, 300, 304, 315, 317, 321, 322, 332, 337, 341, 343, 348, 349, 354, 356, 366, 371, 377, 378, 381, 393, 396, 398, 399];
const P={"gN": [0, 1, 1, 2, 2], "gO": [0, 1, 1, 2, 2, 3], "aN": [0, 1, 1, 2, 3], "aO": [0, 0, 1, 1, 2, 3], "mN": [0, 1, 1, 2, 3], "mO": [0, 1, 1, 2, 2, 3], "lNn": [2, 3, 3, 3], "lNo": [0, 0, 0, 1], "lE": [2, 3, 3, 3, 2], "nNn": [2, 3, 3, 3], "nNo": [0, 0, 0, 1], "nE": [2, 3, 3, 3, 2]};
const FEATS=['g','a','m','l','n'], GSIZE=20, NEED_PER=8, K=10;
const GOAL1=8, GOAL2C=7, GOAL2G=1, MINMOVES=3;
function pick(r,a){return a[Math.floor(r()*a.length)];}
function makeData(seed){
  const r=mulberry(seed), st=[];
  ['N','E'].forEach(gr=>{
    const need=new Set(); while(need.size<NEED_PER) need.add(Math.floor(r()*GSIZE));
    for(let i=0;i<GSIZE;i++){
      const nd=need.has(i);
      const x={g:pick(r,nd?P.gN:P.gO),a:pick(r,nd?P.aN:P.aO),m:pick(r,nd?P.mN:P.mO),
        l:gr==='N'?pick(r,nd?P.lNn:P.lNo):pick(r,P.lE), n:gr==='N'?pick(r,nd?P.nNn:P.nNo):pick(r,P.nE)};
      st.push({id:gr+String(i+1).padStart(2,'0'),grp:gr,need:nd,x:x,tie:r()});
    }
  });
  st.forEach((s,i)=>s.idx=i);
  return st;
}
function evalW(st,w){
  const sc=st.map(s=>({s:s,v:FEATS.reduce((a,f)=>a+w[f]*s.x[f],0)}));
  sc.sort((p,q)=>q.v-p.v||p.s.tie-q.s.tie);
  const top=sc.slice(0,K).map(o=>o.s), ids=new Set(top.map(s=>s.id));
  const fa={N:0,E:0}; top.forEach(s=>{if(!s.need) fa[s.grp]++;});
  return {ids:ids,caught:top.filter(s=>s.need).length,faN:fa.N,faE:fa.E,gap:Math.abs(fa.N-fa.E),top:top};
}

    <section class="card" style="margin-top:0"><h3 style="font-size:20px;margin-bottom:8px">${B('The rules (weights)','Las reglas (pesos)')}</h3><div id="slbox">${slidersHTML(key)}</div></section>

      <section class="card" style="margin-top:0"><div id="tilebox">${tilesHTML(key)}</div><div id="inspbox">${inspectHTML(key)}</div></section>
      <div class="card" style="margin-top:12px"><div id="lockmsg">${done?'':lockMsg(key)}</div>
        <div class="row" style="margin-top:10px"><button class="btn alt" id="btnLock" data-act="lock" ${(done||R.moves<MINMOVES)?'disabled':''}>${B('Lock in this alert','Fijar esta alerta')}</button></div></div></div>
  </div>
  ${done?resultCard(key,next):''}`;
}

const wline=w=>CRIT.map(c=>`<span>${B(esc(c.en),esc(c.es),'inline')}: ${w[c.k]}</span>`).join('');
function cmpCol(key,ttl){
  const r=ev(key), R=S[key];
  return `<section class="card" style="margin-top:0"><h3 style="font-size:21px">${ttl}</h3><div class="wlist">${wline(R.w)}</div>
    <div class="stats"><div class="stat"><span class="big">${r.caught} / 10</span>${B('needed help','necesitaban ayuda')}</div>
      <div class="stat"><span class="big">${r.faN} · ${r.faE}</span>${B(`false alarms: ${GN.N[0]} · ${GN.E[0]}`,`falsas alarmas: ${GN.N[1]} · ${GN.E[1]}`)}</div>
      <div class="stat"><span class="big">${r.gap}</span>${B('gap between neighborhoods','diferencia entre barrios')}</div></div></section>`;
}
function viewCmp(){
  const a=ev('f1'), b=ev('f2'); const diff=a.caught-b.caught;
  const line=diff>0?B(`Making the alert fair cost ${diff} caught ${diff===1?'student':'students'}: ${a.caught} down to ${b.caught}. The gap between neighborhoods went from ${a.gap} to ${b.gap}.`,`Hacer la alerta justa costó ${diff} ${diff===1?'estudiante encontrado':'estudiantes encontrados'}: de ${a.caught} a ${b.caught}. La diferencia entre barrios pasó de ${a.gap} a ${b.gap}.`)
    :diff===0?B(`Your two alerts caught the same number of students (${a.caught}). The gap between neighborhoods went from ${a.gap} to ${b.gap}.`,`Tus dos alertas encontraron la misma cantidad de estudiantes (${a.caught}). La diferencia entre barrios pasó de ${a.gap} a ${b.gap}.`)
    :B(`Your Round 2 alert caught more students (${b.caught} vs ${a.caught}). The gap between neighborhoods went from ${a.gap} to ${b.gap}.`,`Tu alerta de la Ronda 2 encontró más estudiantes (${b.caught} contra ${a.caught}). La diferencia entre barrios pasó de ${a.gap} a ${b.gap}.`);
  return `${stepper('cmp')}
  <section class="card" style="margin-top:12px"><h2>${B('Compare the two alerts','Compara las dos alertas')}</h2><p class="lead">${line}</p></section>
  <div class="cols2" style="margin-top:16px">${cmpCol('f1',B('Round 1: Build the Early Alert','Ronda 1: Arma la Alerta Temprana'))}${cmpCol('f2',B('Round 2: Make it fair','Ronda 2: Hazla justa'))}</div>
  <div class="row" style="margin-top:16px"><button class="btn" data-act="next" data-to="refl">${B('Go to reflection','Ir a la reflexión')}</button></div>`;
}
function reflNeed(){return needLetters(S.refl.trim().length,15)+(S.poll?'':B('Pick one of the four choices above.','Elige una de las cuatro opciones de arriba.'));}
function viewRefl(){
  const ok=S.refl.trim().length>=15&&!!S.poll;
  return `${stepper('refl')}
  <section class="card"><h2>${B('Should the school use this alert?','¿Debería la escuela usar esta alerta?')}</h2>
    <div class="poll">${Object.keys(POLL).map(k=>`<button type="button" data-act="poll" data-k="${k}" aria-pressed="${S.poll===k}"><div style="font-family:Cambria,Georgia,serif;font-size:19px;margin-bottom:4px">${POLL[k].h}</div>${POLL[k].d}</button>`).join('')}</div></section>
  <section class="card"><h2>${B('Reflect','Reflexiona')}</h2>
    <p class="lead">${B('The alert never knew which neighborhood a student lived in. Why did one neighborhood still get more false alarms in Round 1? What would you change, and who should check an alert like this?','La alerta nunca supo en qué barrio vivía un estudiante. ¿Por qué un barrio recibió más falsas alarmas en la Ronda 1? ¿Qué cambiarías y quién debería revisar una alerta así?')}</p>
    <textarea id="inRefl" aria-label="Reflection" placeholder="One neighborhood got more false alarms because…  /  Un barrio recibió más falsas alarmas porque…">${esc(S.refl)}</textarea>
    <p class="muted" style="margin:6px 0 0">${B('You can write in English or Spanish.','Puedes escribir en inglés o en español.')}</p>
    <div class="msg warn" id="reflneed" style="margin-top:8px">${reflNeed()}</div>
    <div class="row" style="margin-top:10px"><button class="btn" id="btnRefl" data-act="next" data-to="turnin" ${ok?'':'disabled'}>${B('Go to turn in','Ir a entregar')}</button></div></section>`;
}

/* ---- turn-in ---- */
const POLLB={a:['Yes, as it is','Sí, tal como está'],b:['Yes, with checks','Sí, con revisiones'],c:['No, do not use it','No, no la usen'],d:['Not sure yet','Todavía no estoy seguro']};
const wTxt=w=>CRIT.map(c=>c.en+' '+w[c.k]).join(', ');
function summary(){
  const L=['WHO GETS FLAGGED — Unit 4, Lesson 6','Name: '+S.name.trim()+'   Period: '+(S.period.trim()||'—'),'Date: '+new Date().toLocaleString(),'Data set: #'+(dsIndex()+1),''];
  [['f1','ROUND 1 (build the alert)'],['f2','ROUND 2 (make it fair)']].forEach(([k,nm])=>{const R=S[k], r=ev(k); L.push(nm+': '+(R.status==='done'?'locked':'not locked')+'; slider changes: '+R.moves); L.push('  Weights: '+wTxt(R.w)); L.push('  Needed help among the 10 flagged: '+r.caught+' of 10; false alarms: North Side '+r.faN+', East Side '+r.faE+'; gap '+r.gap); L.push('');});
  L.push('Should the school use this alert? '+(POLLB[S.poll]?POLLB[S.poll][0]:'(none)'),'','REFLECTION:',S.refl.trim()); return L.join('\n');
}
function PDFNAME(){return 'U4L06_WhoGetsFlagged_'+PDFLIB.fold(S.name)+'.pdf';}
function buildPDF(){
  const d=PDFLIB.doc(); d.title('Who Gets Flagged','Unit 4 · Lesson 6   /   Unidad 4 · Lección 6');
  d.kv('Name / Nombre',S.name.trim()); d.kv('Period / Periodo',S.period.trim()||'—'); d.kv('Date / Fecha',new Date().toLocaleString()); d.kv('Data set / Conjunto de datos','#'+(dsIndex()+1));
  [['f1','Round 1: Build the Early Alert','Ronda 1: Arma la Alerta Temprana'],['f2','Round 2: Make it fair','Ronda 2: Hazla justa']].forEach(([k,en,es])=>{
    const R=S[k], r=ev(k); d.heading(en,es);
    d.line('Status / Estado: '+(R.status==='done'?'Locked / Fijada':'Not locked / Sin fijar')+'     Slider changes / Cambios de control: '+R.moves);
    CRIT.forEach(c=>d.line(c.en+' / '+c.es+': '+R.w[c.k],{size:10.5}));
    d.line('Flagged students who needed help / Estudiantes marcados que necesitaban ayuda: '+r.caught+' of 10');
    d.line('False alarms / Falsas alarmas: North Side / Lado Norte '+r.faN+'     East Side / Lado Este '+r.faE+'     Gap / Diferencia '+r.gap);
  });
  d.heading('Should the school use this alert? / ¿Debería la escuela usar esta alerta?','Mi elección'); const pb=POLLB[S.poll]||['—','—']; d.para(pb[0]+' / '+pb[1]);
  d.heading('Reflection','Reflexión'); d.para(S.refl.trim()||'—');
  return d.build('Who Gets Flagged - '+S.name.trim());
}
function doPDF(){
  const m=$('#pdfmsg');
  try{ PDFLIB.download(buildPDF(),PDFNAME()); m.innerHTML=B('Saved! Now upload the PDF to Canvas.','¡Guardado! Ahora sube el PDF a Canvas.','inline'); }
  catch(err){ m.innerHTML=B('The PDF did not work. Use "Copy as text" below.','El PDF no funcionó. Usa "Copiar como texto" abajo.','inline'); const dt=document.querySelector('details'); if(dt) dt.open=true; }
}
function viewTurnin(){return `${stepper('turnin')}
  <section class="card"><h2>${B('Turn it in','Entrégalo')}</h2>
    <ol style="padding-left:22px;margin:8px 0 0">
      <li style="margin-bottom:8px">${B('Press Download my PDF.','Presiona Descargar mi PDF.')}</li>
      <li style="margin-bottom:8px">${B('Open the Canvas assignment and choose File Upload.','Abre la tarea en Canvas y elige Subir archivo.')}</li>
      <li>${B('Upload the PDF, then press Submit.','Sube el PDF y presiona Enviar.')}</li></ol>
    <div class="row" style="margin-top:14px"><button class="btn" id="btnPdf" data-act="pdf">${B('Download my PDF','Descargar mi PDF')}</button><span id="pdfmsg" class="copied" role="status"></span></div>
    <details style="margin-top:16px"><summary style="cursor:pointer">${B('Trouble downloading? Copy as text instead','¿Problemas para descargar? Copia como texto')}</summary>
      <textarea id="sumbox" class="sumbox" readonly aria-label="Summary" style="margin-top:10px">${esc(summary())}</textarea>
      <div class="row" style="margin-top:10px"><button class="btn ghost" data-act="copy">${B('Copy as text','Copiar como texto')}</button><span id="copymsg" class="copied" role="status"></span></div></details>
  </section>
  <button class="reset" data-act="reset">${B('Start over (clears this device)','Empezar de nuevo (borra este dispositivo)','inline')}</button>`;}

/* ================= render + actions ================= */
function render(){
  document.body.setAttribute('data-lang',S.lang); document.documentElement.lang=S.lang;
  document.querySelectorAll('.langtog button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===S.lang));
  const v={welcome:viewWelcome,f1:()=>viewRound('f1','f2'),f2:()=>viewRound('f2','cmp'),cmp:viewCmp,refl:viewRefl,turnin:viewTurnin}[S.stage];
  $('#app').innerHTML=v(); save();
}
function go(st){
  if(st==='f2'&&!S.started2){ S.f2.w=Object.assign({},S.f1.w); S.started2=true; }   // Round 2 starts from the Round 1 settings
  S.stage=st; render(); window.scrollTo(0,0);
}
function liveUpdate(key){
  const R=S[key]; $('#tilebox').innerHTML=tilesHTML(key); $('#meterbox').innerHTML=metersHTML(key); $('#inspbox').innerHTML=inspectHTML(key);
  const lm=$('#lockmsg'); if(lm) lm.innerHTML=lockMsg(key); const bl=$('#btnLock'); if(bl) bl.disabled=R.moves<MINMOVES;
}
const currentRound=()=>S.stage==='f1'?'f1':S.stage==='f2'?'f2':null;
document.addEventListener('input',e=>{
  const t=e.target, id=t.id;
  if(t.dataset&&t.dataset.k&&t.type==='range'){ const key=currentRound(); if(!key) return; S[key].w[t.dataset.k]=+t.value; const o=$('#o_'+t.dataset.k); if(o) o.textContent=t.value; liveUpdate(key); save(); return; }
  if(id==='inName'){S.name=t.value; save(); const b=$('#btnStart'); if(b) b.disabled=S.name.trim().length<2;}
  else if(id==='inPeriod'){S.period=t.value; save();}
  else if(id==='inRefl'){S.refl=t.value; save(); const b=$('#btnRefl'),n=$('#reflneed'); if(b) b.disabled=!(S.refl.trim().length>=15&&S.poll); if(n) n.innerHTML=reflNeed();}
});
document.addEventListener('change',e=>{
  const t=e.target; if(t.dataset&&t.dataset.k&&t.type==='range'){ const key=currentRound(); if(!key) return; S[key].moves++; liveUpdate(key); save(); }
});
function doCopy(){
  const ta=$('#sumbox'); ta.value=summary(); const m=$('#copymsg');
  const ok=()=>{m.innerHTML=B('Copied! Now paste it into Canvas.','¡Copiado! Ahora pégalo en Canvas.','inline');};
  const fb=()=>{ta.focus();ta.select();try{document.execCommand('copy');ok();}catch(x){m.innerHTML=B('Select the text and press Ctrl+C.','Selecciona el texto y presiona Ctrl+C.','inline');}};
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(ok,fb); else fb();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t||t.disabled) return; const a=t.dataset.act;
  if(a==='lang'){S.lang=t.dataset.l; render();}
  else if(a==='start'){ if(S.name.trim().length>=2) go('f1'); }
  else if(a==='tile'){ S.sel=(S.sel===t.dataset.id)?'':t.dataset.id; const key=currentRound(); $('#tilebox').innerHTML=tilesHTML(key); $('#inspbox').innerHTML=inspectHTML(key); save(); }
  else if(a==='lock'){ const key=currentRound(), R=S[key]; if(R.moves<MINMOVES) return; R.status='done'; R.locks++; render(); const el=$('#result-'+key); if(el) el.scrollIntoView({block:'start'}); }
  else if(a==='reopen'){ S[t.dataset.k].status='open'; render(); window.scrollTo(0,0); }
  else if(a==='next') go(t.dataset.to);
  else if(a==='poll'){S.poll=t.dataset.k; render();}
  else if(a==='pdf') doPDF();
  else if(a==='copy') doCopy();
  else if(a==='reset'){ if(confirm('Start over? This clears your work on this device. / ¿Empezar de nuevo? Esto borra tu trabajo en este dispositivo.')){try{localStorage.removeItem(KEY);}catch(x){} S=fresh(); loadData(); render();} }
});

S=load(); loadData();
if(!['welcome','f1','f2','cmp','refl','turnin'].includes(S.stage)) S.stage='welcome';
if((S.stage==='cmp'||S.stage==='refl'||S.stage==='turnin')&&!(S.f1.status==='done'&&S.f2.status==='done')) S.stage='welcome';
render();
window.__S=()=>S; window.__H={data:()=>DATA,eval:w=>{const r=evalW(DATA,w);return {caught:r.caught,faN:r.faN,faE:r.faE,gap:r.gap,ids:[...r.ids]};},seeds:SEEDS,seed:()=>SEEDS[dsIndex()],makeData:makeData,evalW:evalW};
})();

</script>
</body>
</html>
