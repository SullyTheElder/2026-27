<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Read It Before You Trust It — Unit 4</title>
<style>
:root{--navy:#0F2238;--navy2:#1B3553;--teal:#14907F;--teal-d:#0C6B5E;--mint:#CDEFE4;--amber:#F2B134;--amber-d:#A86F08;--coral:#E8604C;--coral-l:#FCE4DF;--bg:#EEF3F7;--line:#C9D5E0;--sub:#475C72;--ok:#0C6B5E}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Calibri,Carlito,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--navy);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Cambria,Caladea,Georgia,serif;margin:0;line-height:1.15}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* both languages always visible; toggle swaps which is primary */
.bi{display:flex;flex-direction:column}
.bi.inline{display:inline-flex;vertical-align:top}
body[data-lang="en"] .bi .en{order:1;font-weight:700}
body[data-lang="en"] .bi .es{order:2;font-style:italic;font-weight:400;font-size:.86em;color:var(--sub)}
body[data-lang="es"] .bi .es{order:1;font-weight:700}
body[data-lang="es"] .bi .en{order:2;font-style:italic;font-weight:400;font-size:.86em;color:var(--sub)}
.on-dark .bi .en,.on-dark .bi .es{color:#fff}
body[data-lang="en"] .on-dark .bi .es,body[data-lang="es"] .on-dark .bi .en{color:#BCD0E2}
.btn .bi{align-items:center;text-align:center}
.btn .bi .en,.btn .bi .es{color:inherit !important}

header{background:var(--navy);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header .back{color:#BCD0E2;text-decoration:none;font-size:15px;border:1px solid #3B5675;padding:6px 10px;border-radius:6px}
header .ttl{flex:1;min-width:180px}
header h1{font-size:26px}
header .sub{font-size:14px;color:#BCD0E2}
.langtog{display:flex;border:1px solid #3B5675;border-radius:8px;overflow:hidden}
.langtog button{background:transparent;color:#BCD0E2;border:0;padding:7px 14px;font-weight:700}
.langtog button[aria-pressed="true"]{background:var(--teal);color:#fff}
main{max-width:1000px;margin:0 auto;padding:16px 16px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:16px}
.card h2{font-size:23px;margin-bottom:8px}
.lead{font-size:18px;margin:0}
.muted{color:var(--sub)}
.stepper{display:flex;gap:6px;flex-wrap:wrap;list-style:none;padding:0;margin:14px 0 0}
.stepper li{flex:1 1 90px;min-width:84px;border-top:5px solid var(--line);padding-top:5px;font-size:13px;color:var(--sub)}
.stepper li.done{border-color:var(--teal);color:var(--teal-d)}
.stepper li.now{border-color:var(--amber);color:var(--navy)}
.stepper .bi .en,.stepper .bi .es{font-size:13px !important}
.btn{border:0;border-radius:10px;padding:11px 20px;background:var(--teal);color:#fff;min-height:48px}
.btn:hover:not(:disabled){background:var(--teal-d)}
.btn:disabled{background:#B8C6D2;color:#fff;cursor:not-allowed}
.btn.alt{background:var(--navy)}
.btn.alt:hover:not(:disabled){background:var(--navy2)}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn.amber{background:var(--amber);color:var(--navy)}
.btn.amber:hover:not(:disabled){background:#E09E1C}
.btn.amber:disabled{background:#B8C6D2;color:#fff}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hero{background:var(--navy);color:#fff;border-radius:12px;padding:26px 22px;margin-top:16px}
.hero h2{font-size:34px;margin-bottom:10px;color:#fff}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:16px}
.how>div{background:var(--navy2);border-radius:10px;padding:12px 14px}
.how .n{font-family:Cambria,Caladea,Georgia,serif;font-size:26px;color:var(--amber);display:block}
label.f{display:block;margin-top:14px}
label.f .bi{margin-bottom:4px}
input[type=text],textarea{width:100%;border:2px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;min-height:46px}
input[type=text]:focus,textarea:focus{border-color:var(--teal)}
textarea{min-height:120px;resize:vertical}
.fields{display:grid;grid-template-columns:2fr 1fr;gap:12px;max-width:520px}
@media (max-width:620px){.fields{grid-template-columns:1fr}}
.msg.good{color:var(--ok)}
.msg.warn{color:#8A3A00}

/* Part 1: number game */
.guessrow{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.guessrow .gin{width:170px}
.guessrow input{font-size:28px;text-align:center;font-weight:700}
.fb{min-height:64px;margin:12px 0;font-size:20px}
.fb .big{font-family:Cambria,Caladea,Georgia,serif;font-size:30px;font-weight:700}
.fb.up .big{color:var(--teal-d)}
.fb.down .big{color:#9A3412}
.fb.win .big{color:var(--ok)}
.log{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.log li{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.log li.dup{background:var(--coral-l);border-color:var(--coral)}
.log .tag{font-size:12px;font-weight:700;color:#A12C1B}
.rangebar{position:relative;height:30px;background:#fff;border:2px solid var(--navy);border-radius:8px;overflow:hidden;margin:6px 0}
.rangebar .fill{position:absolute;top:0;bottom:0;background:var(--mint);border-left:3px solid var(--teal);border-right:3px solid var(--teal)}
.rangelab{display:flex;justify-content:space-between;font-size:14px;color:var(--sub)}

/* Part 2: card wall */
.target{display:inline-flex;align-items:baseline;gap:10px;background:var(--navy);color:#fff;border-radius:10px;padding:8px 16px}
.target .num{font-family:Cambria,Caladea,Georgia,serif;font-size:34px;font-weight:700;color:var(--amber)}
.wall{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:12px}
@media (max-width:620px){.wall{grid-template-columns:repeat(4,1fr)}}
.tile{aspect-ratio:1/1.1;min-height:56px;border-radius:10px;border:3px solid var(--navy);font-family:Cambria,Caladea,Georgia,serif;font-weight:700;font-size:22px;display:flex;align-items:center;justify-content:center;padding:0}
.tile.down{background:var(--amber);box-shadow:0 3px 0 var(--amber-d);color:var(--navy)}
.tile.down:hover:not(:disabled){transform:translateY(-2px)}
.tile.down .pos{font-size:16px;background:#fff;border:2px solid var(--navy);border-radius:6px;min-width:30px;padding:0 4px}
.tile.up{background:#fff;color:var(--navy)}
.tile.up.found{background:var(--mint);border-color:var(--teal);outline:4px solid var(--teal)}
.tile.up.bad{border-color:var(--coral)}
.tile.rev{background:#F6F9FB;color:var(--sub);border-style:dashed;border-color:var(--line)}
.tile:disabled{cursor:default}
.tilepos{display:block;font-size:11px;font-weight:400;color:var(--sub);font-family:Calibri,Carlito,sans-serif}

/* results */
.result{border:3px solid var(--teal)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:10px 0}
.stat{background:var(--bg);border-radius:10px;padding:10px 14px}
.stat .big{font-family:Cambria,Caladea,Georgia,serif;font-size:34px;font-weight:700;display:block;line-height:1.1}
.bars{margin-top:8px}
.bar{display:grid;grid-template-columns:minmax(150px,240px) 1fr 40px;gap:10px;align-items:center;margin:6px 0}
.bar .track{background:var(--bg);border-radius:6px;height:20px;overflow:hidden}
.bar .fill{height:100%;border-radius:6px}
.bar .num{font-weight:700;text-align:right}
@media (max-width:560px){.bar{grid-template-columns:1fr 1fr 34px}}
.strats{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:10px}
.strat{text-align:left;background:#fff;border:3px solid var(--line);border-radius:12px;padding:12px 14px}
.strat:hover{border-color:var(--teal)}
.strat[aria-pressed="true"]{border-color:var(--teal);background:var(--mint)}
.strat .h{font-family:Cambria,Caladea,Georgia,serif;font-size:19px;margin-bottom:4px}
.strat .bi .en,.strat .bi .es{font-weight:400}
body[data-lang="en"] .strat .bi .en{font-weight:600}
body[data-lang="es"] .strat .bi .es{font-weight:600}
body[data-lang="en"] .strat .h .bi .en,body[data-lang="es"] .strat .h .bi .es{font-weight:700}
.sumbox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;min-height:240px;background:#F6F9FB}
.copied{color:var(--ok);font-weight:700}
.challenge{border:3px dashed var(--amber)}
.reset{background:none;border:0;color:var(--sub);text-decoration:underline;font-size:14px;margin-top:22px}

/* ---- Build a Feed ---- */
.persona{background:var(--mint);border-radius:12px;padding:14px 16px;margin-top:12px}
.sliders{display:flex;flex-direction:column;gap:14px}
.sl{border-bottom:1px solid var(--line);padding-bottom:12px}
.sl:last-child{border-bottom:0}
.sl .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sl output{font-family:Cambria,Caladea,Georgia,serif;font-size:26px;font-weight:700;color:var(--teal-d);min-width:28px;text-align:right}
.sl input[type=range]{width:100%;accent-color:#14907F;height:34px}
.sl .hint{font-size:14px;color:var(--sub)}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.layout{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.meter{background:var(--navy);color:#fff;border-radius:12px;padding:12px 16px;margin-bottom:12px}
.meter .big{font-family:Cambria,Caladea,Georgia,serif;font-size:38px;font-weight:700;color:var(--amber);line-height:1}
.meter .goal{height:14px;background:#2B476A;border-radius:7px;position:relative;margin-top:8px;overflow:hidden}
.meter .goal .bar{position:absolute;left:0;top:0;bottom:0;background:var(--amber);border-radius:7px}
.meter .goal .line{position:absolute;top:-2px;bottom:-2px;width:3px;background:#fff}
.meter.win .big{color:#7CE8C9}
.meter.win .goal .bar{background:#7CE8C9}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.post{display:grid;grid-template-columns:38px 1fr 54px;gap:10px;align-items:start;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.post.in{border-color:var(--teal);background:#F7FCFA}
.post.out{opacity:.62}
.post.wanted{box-shadow:inset 6px 0 0 var(--teal)}
.post .rank{font-family:Cambria,Caladea,Georgia,serif;font-size:24px;font-weight:700;color:var(--navy2)}
.post .who{font-size:14px;color:var(--sub);margin-bottom:2px}
.post .txt{font-size:16px}
.post .txt .bi .en,.post .txt .bi .es{font-weight:400}
body[data-lang="en"] .post .txt .bi .en{font-weight:600}
body[data-lang="es"] .post .txt .bi .es{font-weight:600}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.bdg{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--bg);color:var(--navy2);font-weight:600}
.bdg.hot{background:var(--coral-l);border-color:var(--coral);color:#8A2A1A}
.bdg.ad{background:#FFF3D6;border-color:var(--amber);color:#7A5200}
.delta{font-weight:700;font-size:15px;text-align:right}
.delta.up{color:var(--teal-d)} .delta.down{color:#9A3412}
.cut{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:14px;margin:4px 0}
.cut:before,.cut:after{content:"";flex:1;border-top:3px dashed var(--coral)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:860px){.cols2{grid-template-columns:1fr}}
.wlist{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.wlist>span{display:inline-flex;gap:6px;align-items:baseline;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:14px;font-weight:700}
.poll{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:10px}
.poll button{text-align:left;background:#fff;border:3px solid var(--line);border-radius:12px;padding:10px 14px}
.poll button:hover{border-color:var(--teal)}
.poll button[aria-pressed="true"]{border-color:var(--teal);background:var(--mint)}


/* ---- Who Gets Flagged ---- */
.grp{margin-top:10px}
.grp h4{margin:0 0 6px;font-family:Cambria,Caladea,Georgia,serif;font-size:17px;color:var(--navy2)}
.tiles{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
@media (max-width:620px){.tiles{grid-template-columns:repeat(5,1fr)}}
.tile2{position:relative;border:2px solid var(--line);background:#fff;border-radius:8px;padding:6px 0;font-size:13px;font-weight:700;color:var(--sub);min-height:44px}
.tile2.flag{background:var(--amber);border-color:var(--navy);color:var(--navy);box-shadow:0 2px 0 var(--amber-d)}
.tile2.sel{outline:4px solid var(--teal);outline-offset:1px}
.tile2.need:after{content:"●";position:absolute;right:4px;top:0;color:#0C6B5E;font-size:14px}
.tile2.fa{border-color:var(--coral);background:var(--coral-l);color:#8A2A1A}
.tile2.miss{border-style:dashed;border-color:var(--teal)}
.legend2{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:14px;margin-top:10px;color:var(--sub)}
.legend2 i{display:inline-block;width:14px;height:14px;border-radius:4px;border:2px solid var(--navy);vertical-align:-2px;margin-right:5px}
.inspect{background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:10px;min-height:64px}
.m3{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:8px}
.m3>div{background:#1B3553;border-radius:8px;padding:6px 10px}
.m3 .v{font-family:Cambria,Caladea,Georgia,serif;font-size:26px;font-weight:700;color:var(--amber);line-height:1.1}
.m3 .l{font-size:12px;color:#BCD0E2}
.m3 .ok .v{color:#7CE8C9}
.chk{font-size:15px;margin-top:8px}


/* ---- Clean It Up ---- */
.dtab{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.drow{display:grid;grid-template-columns:76px minmax(90px,1fr) 205px 84px 235px;gap:8px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:10px;padding:6px 10px}
.drow.head{background:transparent;border:0;font-weight:700;color:var(--sub);padding-top:0;padding-bottom:0;font-size:14px}
.drow .id{font-weight:700;font-size:14px;color:var(--navy2)}
.drow .id small{display:block;font-weight:400;color:var(--sub)}
.drow .raw{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;font-weight:700;background:var(--bg);border-radius:6px;padding:4px 8px;overflow-wrap:anywhere}
.drow .raw.blank{color:var(--sub);font-style:italic;font-weight:400}
.drow select,.drow input[type=text]{min-height:40px;padding:6px 8px;font-size:15px}
.drow.right{border-color:var(--teal);background:#F7FCFA}
.drow.wrong{border-color:var(--coral);background:var(--coral-l)}
.drow:has(select[data-f="act"] option[value="keep"]:checked){border-color:#9DB4C8}
@media (max-width:760px){.drow{grid-template-columns:1fr 1fr}.drow.head{display:none}.drow .raw,.drow .id{grid-column:1/-1}}
.m2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
.m2>div{background:#1B3553;border-radius:8px;padding:8px 12px}
.m2 .v{font-family:Cambria,Caladea,Georgia,serif;font-size:30px;font-weight:700;color:var(--amber);line-height:1.1}
.m2 .l{font-size:13px;color:#BCD0E2}
.m2 .good .v{color:#7CE8C9}
.chartbox{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px;overflow-x:auto}
.chartbox svg{width:100%;height:auto;min-width:420px}
.opts{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.opts label{display:block}
select.s1{width:auto;min-width:170px}


/* ---- Make the Chart Lie ---- */
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 14px;margin-top:6px}
.ctrls label{display:block}
.ctrls select{min-height:42px}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:860px){.two2{grid-template-columns:1fr}}
.chip{display:inline-block;background:var(--coral-l);border:1px solid var(--coral);color:#8A2A1A;border-radius:999px;padding:2px 10px;font-size:14px;font-weight:700;margin:2px 4px 2px 0}
.chip.none{background:var(--bg);border-color:var(--line);color:var(--sub);font-weight:400}
.on-dark .chip .bi .en,.on-dark .chip .bi .es{color:#8A2A1A !important;font-size:14px !important}
.on-dark .chip.none .bi .en,.on-dark .chip.none .bi .es{color:#475C72 !important}
.itemgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;margin-top:12px}
.item{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.item.right{border-color:var(--teal);background:#F7FCFA}
.item .claimline{font-size:16px;margin:4px 0 6px}
.item svg{width:100%;height:auto;display:block}
.item .note{font-size:13px;color:var(--sub);margin-top:4px}
.item select{margin-top:8px}
.honest{border:2px dashed var(--teal);background:#F7FCFA}
.two2>*,.itemgrid>*,.ctrls>*{min-width:0}
.item select,.ctrls select{max-width:100%;text-overflow:ellipsis}


/* ---- Honest Infographic ---- */
.poster{border:3px solid var(--navy);border-radius:14px;overflow:hidden;background:#fff}
.poster .band{padding:16px 18px;color:#fff}
.poster .band h3{font-family:Cambria,Caladea,Georgia,serif;font-size:26px;line-height:1.1;margin:0;color:#fff;overflow-wrap:anywhere}
.poster .band p{margin:6px 0 0;font-size:16px;opacity:.95;overflow-wrap:anywhere}
.poster .body{padding:12px 14px}
.poster .facts{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:10px}
@media (max-width:620px){.poster .facts{grid-template-columns:1fr}}
.poster .fact{border-radius:10px;padding:10px 12px}
.poster .fact .num{font-family:Cambria,Caladea,Georgia,serif;font-size:34px;font-weight:700;line-height:1}
.poster .small{font-size:12px;color:#475C72;margin-top:8px}
.checks{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.checks li{display:flex;gap:10px;align-items:flex-start;background:#fff;border:2px solid var(--line);border-radius:10px;padding:6px 10px}
.checks li.ok{border-color:var(--teal);background:#F7FCFA}
.checks li.bad{border-color:var(--coral);background:var(--coral-l)}
.checks li.tip{border-style:dashed}
.checks .ic{font-weight:700;font-size:18px;min-width:22px}
.qrow{background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
.qrow .opts2{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.qrow .opts2 button{border:3px solid var(--line);background:#fff;border-radius:10px;padding:6px 14px;font-weight:700}
.qrow .opts2 button[aria-pressed="true"]{border-color:var(--teal);background:var(--mint)}
.swatch{display:inline-flex;gap:6px;align-items:center}
.swatch i{width:18px;height:18px;border-radius:5px;border:2px solid #0F2238;display:inline-block}
@media (min-width:861px){#posterbox{position:sticky;top:10px}}
.fb{background:#FFF3D6;border:2px solid var(--amber);border-radius:10px;padding:10px 14px;margin-top:10px}


/* ---- Pitch Your Game ---- */
.engines{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:10px}
.engines button{text-align:left;border:3px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px}
.engines button[aria-pressed="true"]{border-color:var(--teal);background:var(--mint)}
.engines .nm{font-family:Cambria,Caladea,Georgia,serif;font-size:20px;font-weight:700;color:var(--navy2)}
.engines .fr{font-size:12px;color:var(--sub);margin-top:4px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tags>span{background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:2px 10px;font-size:14px;display:inline-flex;gap:6px;align-items:baseline}
select{max-width:100%;min-width:0;text-overflow:ellipsis}
.two2>section{min-width:0}
.stepsol{margin:6px 0 0;padding-left:22px}
.stepsol li{margin:3px 0}
.poster .sec{margin-top:10px}
.poster .sec .lab{font-weight:700;font-size:13px;letter-spacing:.3px;text-transform:uppercase;color:#475C72}


/* ---- AI as the Coder ---- */
.code{background:#0F2238;color:#E8F0F7;border-radius:12px;padding:12px 14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14.5px;line-height:1.55;overflow-x:auto;margin:8px 0}
.code .ln{display:block;white-space:pre}
.code .ln i{display:inline-block;width:2.4em;color:#7F9BB5;font-style:normal;user-select:none}
.code .ln.bugged{background:rgba(232,96,76,.28);border-radius:4px}
.code .ln.fixed{background:rgba(20,144,127,.35);border-radius:4px}
.code .gl{display:block;white-space:normal;padding:0 8px 8px 2.4em;font-family:Lato,'Segoe UI',sans-serif;font-size:13.5px;line-height:1.35}
.code .gl .bi{display:block}
.code .gl .bi .en,.code .gl .bi .es{display:block}
.code .gl .bi .en,.code .gl .bi .es{color:#BFE9DD}
.code .gl .bi .es,body[data-lang="es"] .code .gl .bi .en{color:#9FB6CC}
details.decoder{margin-top:8px;border:2px solid var(--line);border-radius:10px;padding:6px 12px;background:#fff}
details.decoder summary{cursor:pointer}
.spec{background:#FFF3D6;border:2px solid var(--amber);border-radius:10px;padding:10px 14px;margin-top:8px}
.ttable{width:100%;border-collapse:collapse;margin-top:10px;font-size:15px}
.ttable th,.ttable td{border:2px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.ttable th{background:var(--bg);font-size:13px}
.ttable td.ok{background:var(--mint);font-weight:700}
.ttable td.no{background:var(--coral-l);font-weight:700}
.mc{display:grid;gap:6px;margin-top:6px}
.mc label{display:flex;gap:8px;align-items:center;border:2px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
.mc label.sel{border-color:var(--teal);background:var(--mint)}
.aibox{border:3px solid var(--navy2);border-radius:12px;background:#fff;padding:10px 14px;margin-top:10px}
.aibox .who{font-weight:700;color:var(--navy2);font-size:14px}
.pchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pchips>span{border:2px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;background:#fff;display:inline-flex;gap:6px;align-items:baseline}
.pchips>span.y{border-color:var(--teal);background:var(--mint)}
.pchips>span.n{border-color:var(--coral);background:var(--coral-l)}
.edgechips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.edgechips>span{border:2px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;background:#fff;display:inline-flex;gap:6px;align-items:baseline}
.edgechips>span.y{border-color:var(--teal);background:var(--mint)}
.trow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.trow input{flex:1;min-width:200px}
.attempt{border-left:5px solid var(--line);padding:4px 0 4px 10px;margin-top:10px}

const PDFLIB=(function(){

  const NAVY=[0.059,0.133,0.22], TEAL=[0.047,0.42,0.369], GRAY=[0.28,0.36,0.45], MINT=[0.804,0.937,0.894], AMBER=[0.992,0.941,0.816], WHITE=[1,1,1];

      lines.forEach((l,i)=>{ if(i>0) d.ensure(15); d.text(l,M+150,y+11,'F1',11,NAVY); y+=15; }); if(!lines.length) y+=15; };

        `${f(X)} ${f(Y-r)} l ${f(X)} ${f(Y-r+k)} ${f(X+r-k)} ${f(Y)} ${f(X+r)} ${f(Y)} c h\n`;}
    d.box=(x,top,w,h,r,fill)=>{ cur+='q\n'+col(fill,false)+col(NAVY,true)+'1.2 w\n'+rr(x,top,w,h,Math.min(r,h/2,w/2))+'B\nQ\n'; };
    d.diamond=(cx,top,w,h,fill)=>{ const Y=H-top; cur+='q\n'+col(fill,false)+col(NAVY,true)+`1.2 w\n${f(cx)} ${f(Y)} m ${f(cx+w/2)} ${f(Y-h/2)} l ${f(cx)} ${f(Y-h)} l ${f(cx-w/2)} ${f(Y-h/2)} l h B\nQ\n`; };
    d.seg=(x1,y1,x2,y2)=>{ cur+='q\n'+col(NAVY,true)+`1.2 w ${f(x1)} ${f(H-y1)} m ${f(x2)} ${f(H-y2)} l S\nQ\n`; };
    d.arrow=(x,y1,y2)=>{ d.seg(x,y1,x,y2-4); cur+='q\n'+col(NAVY,false)+`${f(x-4)} ${f(H-(y2-6))} m ${f(x+4)} ${f(H-(y2-6))} l ${f(x)} ${f(H-y2)} l f\nQ\n`; };
    d.centerLines=(lines,cx,top,h,size,font,c)=>{ const lead=size*1.2, tot=lines.length*lead; let b=top+(h-tot)/2+lead*0.78;
      lines.forEach(l=>{ d.textC(l,cx,b,font||'F1',size,c); b+=lead; }); };
    d.wrap=(s,font,size,w)=>wrap(s,font,size,w);
    d.build=title=>{
      if(cur!==null) pages.push(cur); if(!pages.length) pages.push('');
      const n=pages.length, objs=[]; const kids=[];

      for(let i=0;i<n;i++) kids.push((6+2*i)+' 0 R');
      objs[2]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${n} >>`;
      objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
      objs[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
      objs[5]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>';

  return {doc,fold,download,width:sw,NAVY,TEAL,GRAY,MINT,AMBER,WHITE};
})();

/* ================= shared engine: four AI-written scripts, each with one planted bug ================= */
function rngOf(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const NAMES=['Fox','Owl','Bear','Wolf','Hawk','Lynx','Otter','Crow'];
function shuf(r,a){a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t;} return a;}
const SCRIPTS=[
 {id:'search',name:['Guess the secret number','Adivina el número secreto'],
  spec:['Find a secret number from 1 to 100. After each guess you are told higher or lower. Always guess the middle of what is left. Return how many guesses it took.','Encuentra un número secreto del 1 al 100. Después de cada intento te dicen mayor o menor. Siempre adivina el punto medio de lo que queda. Devuelve cuántos intentos tomó.'],
  call:'find(secret)',code:['def find(secret):','    low = 1','    high = 100','    guesses = 0','    while low <= high:','        mid = (low + high) // 2','        guesses = guesses + 1','        if mid == secret:','            return guesses','        if mid < secret:','            low = mid','        else:','            high = mid - 1'],
  bugLine:11,fixedLine:'            low = mid + 1',bugText:'low = mid',
  fixes:['low = mid + 1','low = mid - 1','high = mid + 1'],rightFix:0,
  fixWhy:['The search must move PAST the guess it just tried. With "low = mid" it can get stuck on the same guess forever.','La búsqueda debe pasar MÁS ALLÁ del intento que acaba de probar. Con "low = mid" puede quedarse atascada en el mismo intento para siempre.'],
  bugWords:['low = mid','low=mid','mid + 1','mid+1','stuck','forever','infinite','never finish','loop'],
  run(x,fixed){let low=1,high=100,g=0; while(low<=high){ if(g>=30) return {stuck:true,g:g}; const mid=Math.floor((low+high)/2); g++; if(mid===x) return {g:g}; if(mid<x) low=fixed?mid+1:mid; else high=mid-1;} return {g:g};},
  fmtOut(r){return r.stuck?'never finishes (stuck after 30 guesses)':r.g+' guesses';},
  fmtIn(x){return 'secret = '+x;},
  parseIn(t){const n=parseInt(String(t).trim(),10); return (String(t).trim()===String(n)&&n>=1&&n<=100)?n:null;},
  inputHint:['A whole number from 1 to 100.','Un número entero del 1 al 100.'],
  edgeIdeas:['the smallest number (1)','the biggest number (100)','a number near the top, like 99','a number right in the middle (50)'],
  edgeIdeasEs:['el número más pequeño (1)','el número más grande (100)','un número cerca del tope, como 99','un número justo en el medio (50)'],
  cats(x){const c=[]; if(x<=2) c.push('low'); if(x>=95) c.push('high'); if(x>=45&&x<=55) c.push('middle'); return c;},
  catNames:{low:['a very low number','un número muy bajo'],high:['a number near the top','un número cerca del tope'],middle:['a number in the middle','un número en el medio']},
  inspector:[100,99,97],
  gen(r){const all=[...Array(100)].map((_,i)=>i+1); const same=s=>this.fmtOut(this.run(s,false))===this.fmtOut(this.run(s,true)); const fail=all.filter(s=>!same(s)), pass=all.filter(same); return {fail:shuf(r,fail),pass:shuf(r,pass)};},
  distract(r,right,used){const d=[]; for(const n of shuf(r,[3,4,5,6,7,8])){const t=n+' guesses'; if(t!==right&&!used.has(t)) d.push(t);} const st='never finishes (stuck after 30 guesses)'; if(st!==right&&!used.has(st)) d.unshift(st); return d;}},
 {id:'max',name:['Highest score','Puntaje más alto'],
  spec:['Return the highest number in the list. The numbers can be negative, like temperature changes.','Devuelve el número más alto de la lista. Los números pueden ser negativos, como cambios de temperatura.'],
  call:'highest(scores)',code:['def highest(scores):','    best = 0','    for s in scores:','        if s > best:','            best = s','    return best'],
  bugLine:2,gloss:[['A recipe named highest. It takes in a list of scores.','Una receta llamada highest. Recibe una lista de puntajes.'],['Start by saying the best score so far is 0.','Empieza diciendo que el mejor puntaje hasta ahora es 0.'],['Go through the list, one score at a time. Call the current one s.','Recorre la lista, un puntaje a la vez. Llama s al actual.'],['If this score is bigger than the best so far...','Si este puntaje es mayor que el mejor hasta ahora...'],['...make it the new best.','...hazlo el nuevo mejor.'],['When the list is done, give back the best.','Cuando termine la lista, devuelve el mejor.']],fixedGloss:['Start with the first score in the list as the best so far.','Empieza con el primer puntaje de la lista como el mejor hasta ahora.'],fixedLine:'    best = scores[0]',bugText:'best = 0',
  fixes:['best = scores[0]','best = 100','if s < best:'],rightFix:0,
  fixWhy:['Starting at 0 only works when some number is above 0. Start with the first number in the list instead.','Empezar en 0 solo funciona si algún número es mayor que 0. Mejor empieza con el primer número de la lista.'],
  bugWords:['best = 0','best=0','negative','scores[0]','first number','first item','first value','start at 0','starts at 0'],

  inputHint:['1 to 8 whole numbers from -99 to 99, separated by commas.','De 1 a 8 números enteros de -99 a 99, separados por comas.'],
  edgeIdeas:['all negative numbers','just one number','a list with repeats','a list with zero in it'],

  distract(r,right,used){const d=[]; for(const v of ['0','-1','5','12','-7']){ if(v!==right&&!used.has(v)) d.push(v);} return shuf(r,d);}},
 {id:'rank',name:['Who goes first','Quién va primero'],

}
function promptBlock(p,i){
  const chip=(ok,en,es)=>`<span class="${ok?'y':'n'}">${ok?'✓':'✗'} ${B(en,es,'inline')}</span>`;
  const inputs=ITEMS.map(x=>x.x);
  return `<div class="attempt"><div><strong>${B('Your prompt','Tu instrucción','inline')} ${i+1}:</strong> “${esc(p.text)}”</div>
    <div class="pchips">${chip(p.c1,'names the problem','nombra el problema')}${chip(p.c2,'says what should happen','dice qué debería pasar')}${chip(p.c3,'gives an example','da un ejemplo')}</div>
    <div class="aibox"><div class="who">${B('AI helper','Ayudante de IA','inline')}</div>${p.fixed?`<p>${B('Got it. I changed that line.','Entendido. Cambié esa línea.')}</p>${codeHTML(SC,true,null)}${testsHTML(inputs,true)}`:`<p>${B('Sure! I tidied up the code and renamed a variable to make it cleaner.','¡Claro! Ordené el código y cambié el nombre de una variable para que quede más limpio.')}</p>${codeHTML(SC,false,null)}<p class="muted" style="margin:6px 0 0">${B('The tests still give the same wrong answers. The AI did not know which line you meant.','Las pruebas siguen dando las mismas respuestas equivocadas. La IA no supo a qué línea te referías.')}</p>${testsHTML(inputs,false)}`}</div></div>`;
}
function viewP3(){
  const P=S.p3, done=P.status==='done', tried=P.prompts.length, left=3-tried;
  return `${stepper('p3')}
  <section class="card" style="margin-top:12px"><h2>${B('Part 3: Ask the AI to fix it','Parte 3: Pídele a la IA que lo arregle')}</h2>
    <p class="lead">${B('A vague message like "fix it" gets a vague answer. Write a prompt that tells the AI exactly what is wrong. Name the problem (a line or the code), say what should happen instead, and give an example. You get 3 prompts.','Un mensaje vago como "arréglalo" recibe una respuesta vaga. Escribe una instrucción que le diga a la IA exactamente qué está mal. Nombra el problema (una línea o el código), di qué debería pasar en su lugar y da un ejemplo. Tienes 3 instrucciones.')}</p>
    ${specHTML()}${glossBar()}${codeHTML(SC,false,null,(S.gloss!==false))}
    ${done?'':`<label class="f">${B('Your prompt to the AI helper','Tu instrucción para el ayudante de IA')}<textarea id="inPrompt" maxlength="400" style="min-height:90px" placeholder="Line __ should __ instead of __. For example, when the input is __ it should give __."></textarea></label>
    <div class="msg warn" id="pneed" style="margin-top:8px">${needLetters(0,20)}</div>
    <div class="row" style="margin-top:10px"><button class="btn alt" id="btnSend" data-act="send" disabled>${B(`Send to the AI helper (${left} ${left===1?'prompt':'prompts'} left)`,`Enviar al ayudante de IA (${left} ${left===1?'instrucción':'instrucciones'} restantes)`)}</button></div>`}
    ${P.prompts.map(promptBlock).join('')}
    ${done&&P.revealed?`<div class="aibox"><div class="who">${B('The fix','El arreglo','inline')}</div><p>${B('Out of prompts. Here is the fix, with the line changed.','Ya no tienes instrucciones. Aquí está el arreglo, con la línea cambiada.')}</p>${codeHTML(SC,true,null)}${testsHTML(ITEMS.map(x=>x.x),true)}</div>`:''}</section>
  ${done?`<section class="card result"><h2>${B('Fixed','Arreglado')}</h2><p>${P.revealed?B('The AI could not fix it until the line and the change were clear. A prompt that names the problem and the change gets better results.','La IA no pudo arreglarlo hasta que la línea y el cambio estuvieron claros. Una instrucción que nombra el problema y el cambio da mejores resultados.'):B('Your prompt named the problem and said what should happen, so the AI fixed the right line. You still ran the tests to check, and that is the habit that matters.','Tu instrucción nombró el problema y dijo qué debía pasar, así que la IA arregló la línea correcta. Aun así corriste las pruebas para revisar, y ese es el hábito que importa.')}</p>
    <div class="row"><button class="btn" data-act="next" data-to="refl">${B('Go to reflection','Ir a la reflexión')}</button></div></section>`:''}`;
}
function reflNeed(){return needLetters(len(S.refl),20);}
function viewRefl(){
  const ok=len(S.refl)>=20;
  return `${stepper('refl')}
  <section class="card"><h2>${B('Reflect','Reflexiona')}</h2>
    <p class="lead">${B('1. The AI\'s code looked fine. What did tracing and testing show that reading quickly would have missed? 2. What made your prompt work, or what would have made it work better? 3. Why do you still need to understand code even when an AI writes it?','1. El código de la IA se veía bien. ¿Qué mostró el rastreo y las pruebas que una lectura rápida no habría visto? 2. ¿Qué hizo que tu instrucción funcionara, o qué la habría hecho funcionar mejor? 3. ¿Por qué todavía necesitas entender el código aunque lo escriba una IA?')}</p>
    <textarea id="inRefl" aria-label="Reflection" style="min-height:170px" placeholder="1… 2… 3…">${esc(S.refl)}</textarea>
    <p class="muted" style="margin:6px 0 0">${B('You can write in English or Spanish.','Puedes escribir en inglés o en español.')}</p>
    <div class="msg warn" id="reflneed" style="margin-top:8px">${reflNeed()}</div>
    <div class="row" style="margin-top:10px"><button class="btn" id="btnRefl" data-act="next" data-to="turnin" ${ok?'':'disabled'}>${B('Go to turn in','Ir a entregar')}</button></div></section>`;
}

/* ---- PDF ---- */
const choice=v=>v||'—';
function PDFNAME(){return 'U4_AICoder1_ReadIt_'+PDFLIB.fold(S.name)+'.pdf';}
function buildPDF(){
  const d=PDFLIB.doc(), o=tally(); d.title('AI as the Coder 1: Read It Before You Trust It','Unit 4   /   Unidad 4');
  d.kv('Name / Nombre',S.name.trim()); d.kv('Period / Periodo',S.period.trim()||'—'); d.kv('Date / Fecha',new Date().toLocaleString()); d.kv('Script / Código',SC.name[0]+' / '+SC.name[1]);
  d.para('Spec / Especificación: '+SC.spec[0],{size:10});
  d.heading('The AI\'s code','El código de la IA'); codeLines(SC,false).forEach((l,i)=>d.para((i+1<10?' ':'')+(i+1)+'   '+l,{size:9.5,indent:6,font:'F1'}));
  d.heading('Part 1: Trace it','Parte 1: Rastréalo');
  d.line('Right on 1st check / Bien en la 1.ª revisión: '+o.first+'     Fixed on 2nd / Corregidas en la 2.ª: '+o.second+'     Revealed / Mostradas: '+o.revealed);
  ITEMS.forEach(i=>d.para(i.id+'  '+SC.fmtIn(i.x)+'   |   my prediction / mi predicción: '+(choice(S.p1.place[i.id]))+'   |   code gives / el código da: '+i.bug+'   |   spec says / la especificación dice: '+i.ref+'   |   '+(i.bug===i.ref?'match':'MISMATCH')+'   |   '+(S.p1.item[i.id]||'—'),{size:9.5,indent:6}));
  d.heading('Part 2: Find the bug','Parte 2: Halla el error');
  d.line('Bug is on line / El error está en la línea: '+SC.bugLine+' ('+SC.bugText+')     Right fix / Arreglo correcto: '+SC.fixes[SC.rightFix]);
  d.line('My picks / Mis elecciones: line '+choice(S.p2.line)+' and fix "'+(S.p2.fix!==''&&FIXOPTS[S.p2.fix]?FIXOPTS[S.p2.fix].t:'—')+'"     Tries / Intentos: '+S.p2.tries+(S.p2.revealed?' (revealed / mostrado)':''));
  d.heading('Part 3: Ask the AI to fix it','Parte 3: Pídele a la IA que lo arregle');
  S.p3.prompts.forEach((p,i)=>{d.para('Prompt '+(i+1)+': "'+p.text+'"',{size:10,indent:6}); d.line('    names the problem: '+(p.c1?'yes':'no')+'   says what should happen: '+(p.c2?'yes':'no')+'   gives an example: '+(p.c3?'yes':'no')+'   =>   '+(p.fixed?'AI fixed the right line / la IA arregló la línea correcta':'AI did not fix it / la IA no lo arregló'),{size:9.5});});
  if(S.p3.revealed) d.line('Revealed after 3 prompts / Mostrado después de 3 instrucciones',{size:9.5});
  d.heading('Reflection','Reflexión'); d.para(S.refl.trim()||'—');
  return d.build('AI as the Coder 1 - '+S.name.trim());
}
function summary(){
  const o=tally(), L=['AI AS THE CODER 1 — READ IT BEFORE YOU TRUST IT','Name: '+S.name.trim()+'   Period: '+(S.period.trim()||'—'),'Date: '+new Date().toLocaleString(),'Script: '+SC.name[0],'Spec: '+SC.spec[0],'','CODE:'].concat(codeLines(SC,false).map((l,i)=>(i+1)+'  '+l));
  L.push('','PART 1: right on 1st check '+o.first+', fixed on 2nd '+o.second+', revealed '+o.revealed); ITEMS.forEach(i=>L.push('  '+i.id+' '+SC.fmtIn(i.x)+': predicted '+choice(S.p1.place[i.id])+'; code gives '+i.bug+'; spec says '+i.ref));
  L.push('','PART 2: bug on line '+SC.bugLine+'; student picked line '+choice(S.p2.line)+' and "'+(S.p2.fix!==''&&FIXOPTS[S.p2.fix]?FIXOPTS[S.p2.fix].t:'—')+'" (tries '+S.p2.tries+')','','PART 3:'); S.p3.prompts.forEach((p,i)=>L.push('  Prompt '+(i+1)+': "'+p.text+'" -> '+(p.fixed?'AI fixed it':'AI did not fix it')));
  L.push('','REFLECTION:',S.refl.trim()); return L.join('\n');
}
function doPDF(){
  const m=$('#pdfmsg');
  try{ PDFLIB.download(buildPDF(),PDFNAME()); m.innerHTML=B('Saved! Now upload the PDF to Canvas.','¡Guardado! Ahora sube el PDF a Canvas.','inline'); }
  catch(err){ m.innerHTML=B('The PDF did not work. Use "Copy as text" below.','El PDF no funcionó. Usa "Copiar como texto" abajo.','inline'); const dt=document.querySelector('details'); if(dt) dt.open=true; }
}
function viewTurnin(){return `${stepper('turnin')}
  <section class="card"><h2>${B('Turn it in','Entrégalo')}</h2>
    <ol style="padding-left:22px;margin:8px 0 0">
      <li style="margin-bottom:8px">${B('Press Download my PDF.','Presiona Descargar mi PDF.')}</li>
      <li style="margin-bottom:8px">${B('Open the Canvas assignment and choose File Upload.','Abre la tarea en Canvas y elige Subir archivo.')}</li>
      <li>${B('Upload the PDF, then press Submit.','Sube el PDF y presiona Enviar.')}</li></ol>
    <div class="row" style="margin-top:14px"><button class="btn" id="btnPdf" data-act="pdf">${B('Download my PDF','Descargar mi PDF')}</button><span id="pdfmsg" class="copied" role="status"></span></div>
    <details style="margin-top:16px"><summary style="cursor:pointer">${B('Trouble downloading? Copy as text instead','¿Problemas para descargar? Copia como texto')}</summary>
      <textarea id="sumbox" class="sumbox" readonly aria-label="Summary" style="margin-top:10px">${esc(summary())}</textarea>
      <div class="row" style="margin-top:10px"><button class="btn ghost" data-act="copy">${B('Copy as text','Copiar como texto')}</button><span id="copymsg" class="copied" role="status"></span></div></details></section>
  <button class="reset" data-act="reset">${B('Start over (clears this device)','Empezar de nuevo (borra este dispositivo)','inline')}</button>`;}

/* ================= render + actions ================= */
function render(){
  document.body.setAttribute('data-lang',S.lang); document.documentElement.lang=S.lang;
  document.querySelectorAll('.langtog button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===S.lang));
  const v={welcome:viewWelcome,p1:viewP1,p2:viewP2,p3:viewP3,refl:viewRefl,turnin:viewTurnin}[S.stage];
  $('#app').innerHTML=v(); save();
}
function go(st){S.stage=st; render(); window.scrollTo(0,0);}
document.addEventListener('input',e=>{
  const t=e.target,id=t.id;
  if(id==='inName'){S.name=t.value; save(); const b=$('#btnStart'); if(b) b.disabled=S.name.trim().length<2;}
  else if(id==='inPeriod'){S.period=t.value; save();}
  else if(id==='inRefl'){S.refl=t.value; save(); const b=$('#btnRefl'),n=$('#reflneed'); if(b) b.disabled=len(S.refl)<20; if(n) n.innerHTML=reflNeed();}
  else if(id==='inPrompt'){ const n=len(t.value); $('#pneed').innerHTML=needLetters(n,20); $('#btnSend').disabled=n<20; }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='ckGloss'){S.gloss=t.checked; render(); return;}
  if(t.dataset&&t.dataset.i&&S.stage==='p1'){ S.p1.place[t.dataset.i]=t.value; const inc=incomplete1().length; $('#need1').innerHTML=inc?B(`${inc} ${inc===1?'prediction still needs':'predictions still need'} an answer.`,`${inc} ${inc===1?'predicción todavía necesita':'predicciones todavía necesitan'} una respuesta.`):B('Every input has a prediction. You can check.','Todas las entradas tienen una predicción. Ya puedes revisar.'); $('#btnCheck1').disabled=inc>0||S.p1.status==='done'; document.querySelectorAll('.mc label').forEach(l=>{const r=l.querySelector('input'); l.classList.toggle('sel',r.checked);}); save(); return; }
  if(t.id==='selLine'){ S.p2.line=t.value; $('#btnCheck2').disabled=!(S.p2.line&&S.p2.fix!==''); save(); return; }
  if(t.id==='selFix'){ S.p2.fix=t.value; $('#btnCheck2').disabled=!(S.p2.line&&S.p2.fix!==''); save(); return; }
});
function doCopy(){
  const ta=$('#sumbox'); ta.value=summary(); const m=$('#copymsg');
  const ok=()=>{m.innerHTML=B('Copied! Now paste it into Canvas.','¡Copiado! Ahora pégalo en Canvas.','inline');};
  const fb=()=>{ta.focus();ta.select();try{document.execCommand('copy');ok();}catch(x){m.innerHTML=B('Select the text and press Ctrl+C.','Selecciona el texto y presiona Ctrl+C.','inline');}};
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(ok,fb); else fb();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t||t.disabled) return; const a=t.dataset.act;
  if(a==='lang'){S.lang=t.dataset.l; render();}
  else if(a==='start'){ if(S.name.trim().length>=2) go('p1'); }
  else if(a==='check1'){ runCheck1(); render(); const el=$('#result-p1'); if(el) el.scrollIntoView({block:'start'}); else {const m=$('#msg1'); if(m) m.scrollIntoView({block:'center'});} }
  else if(a==='check2'){ const P=S.p2; if(P.status==='done'||!(P.line&&P.fix!=='')) return; P.tries++; const ok=(+P.line===SC.bugLine)&&FIXOPTS[+P.fix].right; if(ok||P.tries>=2){ P.status='done'; P.revealed=!ok; render(); const el=$('#result-p2'); if(el) el.scrollIntoView({block:'start'}); } else { $('#msg2').innerHTML=msg2(); $('#btnCheck2').innerHTML=B(`Check (${2-P.tries} ${2-P.tries===1?'try':'tries'} left)`,`Revisar (${2-P.tries} ${2-P.tries===1?'intento':'intentos'})`); save(); } }
  else if(a==='send'){ const txt=$('#inPrompt').value; if(len(txt)<20||S.p3.status==='done') return; const c=promptCheck(SC,txt); S.p3.prompts.push({text:txt.trim(),c1:c.c1,c2:c.c2,c3:c.c3,fixed:c.fixed}); if(c.fixed||S.p3.prompts.length>=3){ S.p3.status='done'; S.p3.revealed=!c.fixed; } render(); const els=document.querySelectorAll('.attempt'); if(els.length) els[els.length-1].scrollIntoView({block:'center'}); }
  else if(a==='next'){ const to=t.dataset.to; if(to==='p2'&&S.p1.status!=='done') return; if(to==='p3'&&S.p2.status!=='done') return; if(to==='refl'&&S.p3.status!=='done') return; go(to); }
  else if(a==='pdf') doPDF();
  else if(a==='copy') doCopy();
  else if(a==='reset'){ if(confirm('Start over? This clears your work on this device. / ¿Empezar de nuevo? Esto borra tu trabajo en este dispositivo.')){try{localStorage.removeItem(KEY);}catch(x){} S=fresh(); setup(); render();} }
});

S=load(); setup();
if(!['welcome','p1','p2','p3','refl','turnin'].includes(S.stage)) S.stage='welcome';
if(['p2','p3','refl','turnin'].includes(S.stage)&&S.p1.status!=='done') S.stage='p1';
if(['p3','refl','turnin'].includes(S.stage)&&S.p2.status!=='done') S.stage='p2';
if(['refl','turnin'].includes(S.stage)&&S.p3.status!=='done') S.stage='p3';
render();
window.__S=()=>S; window.__H={sc:()=>SC,items:()=>ITEMS,fixopts:()=>FIXOPTS,promptCheck:promptCheck};
})();

</script>
</body>
</html>
