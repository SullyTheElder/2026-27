<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Break It Down — Unit 4, Lesson 2</title>
<style>
:root{--navy:#0F2238;--navy2:#1B3553;--teal:#14907F;--teal-d:#0C6B5E;--mint:#CDEFE4;--amber:#F2B134;--amber-d:#A86F08;--coral:#E8604C;--coral-l:#FCE4DF;--bg:#EEF3F7;--line:#C9D5E0;--sub:#475C72;--ok:#0C6B5E}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Calibri,Carlito,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--navy);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Cambria,Caladea,Georgia,serif;margin:0;line-height:1.15}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* both languages always visible; toggle swaps which is primary */
.bi{display:flex;flex-direction:column}
.bi.inline{display:inline-flex;vertical-align:top}
body[data-lang="en"] .bi .en{order:1;font-weight:700}
body[data-lang="en"] .bi .es{order:2;font-style:italic;font-weight:400;font-size:.86em;color:var(--sub)}
body[data-lang="es"] .bi .es{order:1;font-weight:700}
body[data-lang="es"] .bi .en{order:2;font-style:italic;font-weight:400;font-size:.86em;color:var(--sub)}
.on-dark .bi .en,.on-dark .bi .es{color:#fff}
body[data-lang="en"] .on-dark .bi .es,body[data-lang="es"] .on-dark .bi .en{color:#BCD0E2}
.btn .bi{align-items:center;text-align:center}
.btn .bi .en,.btn .bi .es{color:inherit !important}

header{background:var(--navy);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header .back{color:#BCD0E2;text-decoration:none;font-size:15px;border:1px solid #3B5675;padding:6px 10px;border-radius:6px}
header .ttl{flex:1;min-width:180px}
header h1{font-size:26px}
header .sub{font-size:14px;color:#BCD0E2}
.langtog{display:flex;border:1px solid #3B5675;border-radius:8px;overflow:hidden}
.langtog button{background:transparent;color:#BCD0E2;border:0;padding:7px 14px;font-weight:700}
.langtog button[aria-pressed="true"]{background:var(--teal);color:#fff}
main{max-width:1000px;margin:0 auto;padding:16px 16px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:16px}
.card h2{font-size:23px;margin-bottom:8px}
.lead{font-size:18px;margin:0}
.muted{color:var(--sub)}
.stepper{display:flex;gap:6px;flex-wrap:wrap;list-style:none;padding:0;margin:14px 0 0}
.stepper li{flex:1 1 90px;min-width:84px;border-top:5px solid var(--line);padding-top:5px;font-size:13px;color:var(--sub)}
.stepper li.done{border-color:var(--teal);color:var(--teal-d)}
.stepper li.now{border-color:var(--amber);color:var(--navy)}
.stepper .bi .en,.stepper .bi .es{font-size:13px !important}
.btn{border:0;border-radius:10px;padding:11px 20px;background:var(--teal);color:#fff;min-height:48px}
.btn:hover:not(:disabled){background:var(--teal-d)}
.btn:disabled{background:#B8C6D2;color:#fff;cursor:not-allowed}
.btn.alt{background:var(--navy)}
.btn.alt:hover:not(:disabled){background:var(--navy2)}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn.ghost:hover:not(:disabled){background:#E1EAF2}
.btn.small{min-height:38px;padding:6px 14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hero{background:var(--navy);color:#fff;border-radius:12px;padding:26px 22px;margin-top:16px}
.hero h2{font-size:34px;margin-bottom:10px;color:#fff}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:16px}
.how>div{background:var(--navy2);border-radius:10px;padding:12px 14px}
.how .n{font-family:Cambria,Caladea,Georgia,serif;font-size:26px;color:var(--amber);display:block}
label.f{display:block;margin-top:14px}
label.f .bi{margin-bottom:4px}
input[type=text],textarea,select{width:100%;border:2px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;min-height:46px}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--teal)}
textarea{min-height:120px;resize:vertical}
.fields{display:grid;grid-template-columns:2fr 1fr;gap:12px;max-width:520px}

/* status + results */
.status{min-height:48px;margin:6px 0}
.msg.good{color:var(--ok)}
.msg.warn{color:#8A3A00}
.tagrev{display:inline-block;background:var(--amber);color:var(--navy);border-radius:6px;padding:2px 8px;font-size:13px;font-weight:700}
.checkbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:14px}
.result{border:3px solid var(--teal)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:10px 0}
.stat{background:var(--bg);border-radius:10px;padding:10px 14px}
.stat .big{font-family:Cambria,Caladea,Georgia,serif;font-size:34px;font-weight:700;display:block;line-height:1.1}

/* Part 1: sort tasks into groups */
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:60px;padding:10px;background:#F6F9FB;border:2px dashed var(--line);border-radius:10px}
.task{background:#fff;border:2px solid var(--navy);border-radius:10px;padding:8px 12px;text-align:left;box-shadow:0 2px 0 var(--navy);max-width:260px;font-size:16px}
.task:hover:not(:disabled){background:var(--mint)}
.task.sel{outline:5px solid var(--teal);outline-offset:2px;background:var(--mint)}
.task:disabled{cursor:default;opacity:1}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-top:12px}
.group{border:3px solid var(--navy);border-radius:12px;padding:10px;background:#fff;text-align:left;min-height:170px;display:flex;flex-direction:column;gap:8px}
.group.target{background:#F1FAF7}
.group>.gh{font-family:Cambria,Caladea,Georgia,serif;font-size:19px;border-bottom:2px solid var(--line);padding-bottom:6px}
.group .placed{display:flex;flex-direction:column;gap:6px}
.group .task{box-shadow:none;max-width:none;width:100%}
.hold{padding:8px 12px;background:var(--mint);border-radius:8px;margin-bottom:8px}

/* Part 2/3: shapes */
.shape{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 18px;border:3px solid var(--navy);background:#fff;min-width:200px;max-width:100%}
.shape.oval{border-radius:999px}
.shape.rect{border-radius:8px}
.shape.dia{border:0;background:transparent;padding:38px 78px;min-height:118px;min-width:300px}
.diabg{position:absolute;left:0;top:0;width:100%;height:100%}
.diabg polygon{fill:#fff;stroke:#0F2238;stroke-width:3;vector-effect:non-scaling-stroke}
.shape .txt{position:relative;font-size:16px}
button.slot{padding:0;background:none;border:0;display:block;max-width:100%}
button.slot .shape{width:100%}
button.slot.empty .shape{border-style:dashed;background:#F6F9FB;color:var(--sub)}
button.slot.empty .diabg polygon{fill:#F6F9FB;stroke-dasharray:7 5}
button.slot:hover:not(:disabled) .shape{background:var(--mint)}
button.slot:hover:not(:disabled) .diabg polygon{fill:#CDEFE4}
button.slot.bad .shape{border-color:var(--coral)}
button.slot.bad .diabg polygon{stroke:#E8604C}
.flow{display:flex;flex-direction:column;align-items:center;gap:4px;margin:12px auto 0}
.flow .arrow{font-size:26px;line-height:1;color:var(--navy)}
.flow .lab{font-weight:700;color:var(--teal-d);font-size:15px}
.decrow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.decrow .side{display:flex;align-items:center;gap:8px}
.loopnote{font-size:14px;color:var(--sub);max-width:150px}
.bank{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:12px;background:#F6F9FB;border:2px dashed var(--line);border-radius:10px;margin-top:10px;min-height:70px}
.bank .shape{min-width:0;cursor:pointer}
.bank .dia{min-width:0;padding:34px 60px;min-height:104px}
.blk{background:none;border:0;padding:0}
.blk.sel .shape{outline:5px solid var(--teal);outline-offset:3px}
.blk.sel .dia .diabg{filter:drop-shadow(0 0 0 #14907F)}
.blk.sel .shape.dia{outline:none}
.blk.sel .shape.dia .diabg polygon{stroke:#14907F;stroke-width:6}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:10px 0}
.legend>div{display:flex;gap:12px;align-items:center}
.legend .shape{min-width:0;width:90px;height:50px;padding:0}
.legend .shape.dia{padding:0;min-width:0;min-height:0;width:90px;height:60px}

/* Part 3: builder */
.bcard{border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;background:#fff}
.bcard .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.bcard .top .kind{flex:1;font-family:Cambria,Caladea,Georgia,serif;font-size:18px}
.bcard.dec{border-color:var(--teal)}
.ico{border:2px solid var(--line);background:#fff;border-radius:6px;min-width:38px;height:38px;padding:0 8px}
.ico:hover:not(:disabled){border-color:var(--teal);background:var(--mint)}
.ico:disabled{opacity:.35;cursor:not-allowed}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:620px){.two,.fields{grid-template-columns:1fr}}
.prev{background:#F6F9FB;border:2px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.prev .flow{margin-top:0}
.branches{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;align-items:flex-start}
.branches>div{display:flex;flex-direction:column;align-items:center;gap:4px}
.prev .shape{min-width:160px}
.prev .shape.dia{min-width:260px}
.prev .shape .txt{overflow-wrap:anywhere}
.sumbox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;min-height:260px;background:#F6F9FB}
.copied{color:var(--ok);font-weight:700}
.reset{background:none;border:0;color:var(--sub);text-decoration:underline;font-size:14px;margin-top:22px}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>

<script>
(function(){
'use strict';
/* ===== tiny dependency-free PDF writer (Helvetica, WinAnsi, vector shapes) ===== */
const PDFLIB=(function(){
  const R=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,
    667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,
    556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
  const BD=[278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,

    556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584];
  const MAP={'\u2018':0x91,'\u2019':0x92,'\u201C':0x93,'\u201D':0x94,'\u2013':0x96,'\u2014':0x97,'\u2026':0x85,'\u2022':0x95};

  function sw(s,font,size){let w=0; for(const ch of s) w+=cw(ch,font); return w*size;}
  function enc(s){
    let o=''; s=String(s).normalize('NFC');
    for(const ch of s){
      let c=ch.codePointAt(0);
      if(MAP[ch]) c=MAP[ch]; else if(c>255) c=63;
      if(c===40||c===41||c===92) o+='\\'+String.fromCharCode(c);
      else if(c<32) o+=' ';
      else if(c>126) o+='\\'+c.toString(8).padStart(3,'0');
      else o+=String.fromCharCode(c);
    } return o;
  }
  function wrap(s,font,size,maxW){
    const out=[];
    String(s).split(/\r?\n/).forEach(par=>{
      let line='';
      par.split(/\s+/).filter(Boolean).forEach(w0=>{
        let w=w0;

          let k=1; while(k<w.length&&sw(w.slice(0,k+1),font,size)<=maxW) k++;

      });
      out.push(line);
    });
    return out;
  }
  const NAVY=[0.059,0.133,0.22], TEAL=[0.047,0.42,0.369], GRAY=[0.28,0.36,0.45], MINT=[0.804,0.937,0.894], AMBER=[0.992,0.941,0.816], WHITE=[1,1,1];
  function doc(){
    const W=612,H=792,M=54; const pages=[]; let cur=null; let y=M;
    const f=n=>(Math.round(n*100)/100).toString();
    const col=(c,s)=>`${f(c[0])} ${f(c[1])} ${f(c[2])} ${s?'RG':'rg'}\n`;
    const d={W,H,M};
    d.newPage=()=>{ if(cur!==null) pages.push(cur); cur=''; y=M; };
    d.y=()=>y; d.setY=v=>{y=v;};
    d.ensure=h=>{ if(cur===null||y+h>H-M) d.newPage(); };
    d.text=(s,x,base,font,size,c)=>{ cur+=col(c||NAVY,false)+`BT /${font} ${size} Tf ${f(x)} ${f(H-base)} Td (${enc(s)}) Tj ET\n`; };
    d.textC=(s,cx,base,font,size,c)=>{ d.text(s,cx-sw(s,font,size)/2,base,font,size,c); };
    d.title=(en,sub)=>{ d.ensure(60); d.text(en,M,y+20,'F2',22,NAVY); d.text(sub,M,y+38,'F3',11,GRAY); y+=54; };
    d.kv=(k,v)=>{ d.ensure(18); d.text(k+':',M,y+11,'F2',11,NAVY); const lines=wrap(v,'F1',11,W-2*M-150);
      lines.forEach((l,i)=>{ if(i>0) d.ensure(15); d.text(l,M+150,y+11,'F1',11,NAVY); y+=15; }); if(!lines.length) y+=15; };
    d.gap=n=>{y+=n;};
    d.heading=(en,es)=>{ d.ensure(52); y+=10; d.text(en,M,y+12,'F2',13,TEAL); d.text(es,M,y+26,'F3',10.5,GRAY);
      cur+=col(TEAL,true)+`0.8 w ${M} ${f(H-(y+31))} m ${W-M} ${f(H-(y+31))} l S\n`; y+=40; };
    d.para=(s,o)=>{ o=o||{}; const size=o.size||11, font=o.font||'F1', lead=size*1.35, w=W-2*M-(o.indent||0);
      wrap(s,font,size,w).forEach(l=>{ d.ensure(lead+2); d.text(l,M+(o.indent||0),y+size,font,size,o.color||NAVY); y+=lead; }); y+=4; };
    d.line=(s,o)=>d.para(s,o);
    /* ---- shapes (top-left coordinates) ---- */
    function rr(x,top,w,h,r){const k=0.5523*r,X=x,Y=H-top;
      return `${f(X+r)} ${f(Y)} m ${f(X+w-r)} ${f(Y)} l ${f(X+w-r+k)} ${f(Y)} ${f(X+w)} ${f(Y-r+k)} ${f(X+w)} ${f(Y-r)} c ${f(X+w)} ${f(Y-h+r)} l `+
        `${f(X+w)} ${f(Y-h+r-k)} ${f(X+w-r+k)} ${f(Y-h)} ${f(X+w-r)} ${f(Y-h)} c ${f(X+r)} ${f(Y-h)} l ${f(X+r-k)} ${f(Y-h)} ${f(X)} ${f(Y-h+r-k)} ${f(X)} ${f(Y-h+r)} c `+
        `${f(X)} ${f(Y-r)} l ${f(X)} ${f(Y-r+k)} ${f(X+r-k)} ${f(Y)} ${f(X+r)} ${f(Y)} c h\n`;}
    d.box=(x,top,w,h,r,fill)=>{ cur+='q\n'+col(fill,false)+col(NAVY,true)+'1.2 w\n'+rr(x,top,w,h,Math.min(r,h/2,w/2))+'B\nQ\n'; };
    d.diamond=(cx,top,w,h,fill)=>{ const Y=H-top; cur+='q\n'+col(fill,false)+col(NAVY,true)+`1.2 w\n${f(cx)} ${f(Y)} m ${f(cx+w/2)} ${f(Y-h/2)} l ${f(cx)} ${f(Y-h)} l ${f(cx-w/2)} ${f(Y-h/2)} l h B\nQ\n`; };
    d.seg=(x1,y1,x2,y2)=>{ cur+='q\n'+col(NAVY,true)+`1.2 w ${f(x1)} ${f(H-y1)} m ${f(x2)} ${f(H-y2)} l S\nQ\n`; };
    d.arrow=(x,y1,y2)=>{ d.seg(x,y1,x,y2-4); cur+='q\n'+col(NAVY,false)+`${f(x-4)} ${f(H-(y2-6))} m ${f(x+4)} ${f(H-(y2-6))} l ${f(x)} ${f(H-y2)} l f\nQ\n`; };
    d.centerLines=(lines,cx,top,h,size,font,c)=>{ const lead=size*1.2, tot=lines.length*lead; let b=top+(h-tot)/2+lead*0.78;
      lines.forEach(l=>{ d.textC(l,cx,b,font||'F1',size,c); b+=lead; }); };
    d.wrap=(s,font,size,w)=>wrap(s,font,size,w);
    d.build=title=>{
      if(cur!==null) pages.push(cur); if(!pages.length) pages.push('');
      const n=pages.length, objs=[]; const kids=[];
      objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
      for(let i=0;i<n;i++) kids.push((6+2*i)+' 0 R');
      objs[2]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${n} >>`;
      objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
      objs[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
      objs[5]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>';
      pages.forEach((p,i)=>{
        objs[6+2*i]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R >> >> /Contents ${7+2*i} 0 R >>`;
        objs[7+2*i]=`<< /Length ${p.length} >>\nstream\n${p}endstream`;
      });
      const info=6+2*n; objs[info]=`<< /Title (${enc(title||'')}) /Producer (Class Resources Site) >>`;
      let out='%PDF-1.4\n%\u00E2\u00E3\u00CF\u00D3\n'; const off=[];
      for(let i=1;i<=info;i++){ off[i]=out.length; out+=`${i} 0 obj\n${objs[i]}\nendobj\n`; }
      const xr=out.length; out+=`xref\n0 ${info+1}\n0000000000 65535 f \n`;
      for(let i=1;i<=info;i++) out+=String(off[i]).padStart(10,'0')+' 00000 n \n';
      out+=`trailer\n<< /Size ${info+1} /Root 1 0 R /Info ${info} 0 R >>\nstartxref\n${xr}\n%%EOF`;
      const u=new Uint8Array(out.length); for(let i=0;i<out.length;i++) u[i]=out.charCodeAt(i)&255; return u;
    };
    d.newPage();
    return d;
  }
  function fold(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'')||'student';}
  function download(bytes,name){
    const blob=new Blob([bytes],{type:'application/pdf'}), url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},2000);
  }
  return {doc,fold,download,width:sw,NAVY,TEAL,GRAY,MINT,AMBER,WHITE};

/* generic checker for part 1 and part 2 */
function runCheck(P,ids,truth){
  if(P.status==='done') return;
  if(ids.some(i=>!P.place[i])) return;
  P.checks++;
  const res={}; let k=0; ids.forEach(i=>{res[i]=P.place[i]===truth[i]; if(res[i]) k++;});
  P['c'+P.checks]=res;
  if(k===ids.length || P.checks>=2){
    ids.forEach(i=>{
      const c1=P.c1[i], c2=P.c2?P.c2[i]:null;
      if(P.checks===1) P.item[i]='first';
      else P.item[i]= (c1&&c2)?'first':(!c1&&c2)?'second':'revealed';
    });
    const allRight=k===ids.length;
    ids.forEach(i=>{P.place[i]=truth[i];});
    P.status='done'; P.sel=null;
    P.msg={t: allRight?(P.checks===1?'first':'second'):'revealed'};
  } else P.msg={t:'wrong',k:k,n:ids.length};
}
function msgHTML(P){
  const m=P.msg; if(!m) return '';
  if(m.t==='first') return `<div class="msg good">${B('Perfect! Everything is in the right place.','¡Perfecto! Todo está en su lugar.')}</div>`;
  if(m.t==='second') return `<div class="msg good">${B('Got it on the second check. Everything is in the right place.','Lo lograste en la segunda revisión. Todo está en su lugar.')}</div>`;
  if(m.t==='wrong') return `<div class="msg warn">${B(`Not yet. ${m.k} of ${m.n} are in the right place. You have 1 check left. Think about it, then check again.`,`Todavía no. ${m.k} de ${m.n} están en su lugar. Te queda 1 revisión. Piénsalo y revisa otra vez.`)}</div>`;
  if(m.t==='revealed') return `<div class="msg warn">${B('Out of checks. The correct answer is now showing. Look at it and think about what you missed.','Ya no tienes revisiones. Se muestra la respuesta correcta. Míralo y piensa qué se te pasó.')} <span class="tagrev">${B('revealed','mostrado','inline')}</span></div>`;
  return '';
}
function resultStats(P,label){
  const o=outcomeOf(P);
  return `<div class="stats">
    <div class="stat"><span class="big">${o.first}</span>${B('right on the 1st check','bien en la 1.ª revisión')}</div>
    <div class="stat"><span class="big">${o.second}</span>${B('fixed on the 2nd check','corregidas en la 2.ª revisión')}</div>
    <div class="stat"><span class="big">${o.revealed}</span>${B('revealed','mostradas')}</div></div>`;
}

function builderProblems(){

  const txtOk=p3.blocks.every(b=>b.a.trim().length>=3 && (b.t==='step'||(b.y.trim().length>=3&&b.n.trim().length>=3)));
  const probOk=p3.prob && (p3.prob!=='other'||p3.custom.trim().length>=3);
  return {st,dc,txtOk,probOk,ok:!!(probOk&&st>=3&&dc>=1&&txtOk)};

  if(pb.st<3) bits.push(B(`Steps so far: ${pb.st} of 3 needed.`,`Pasos hasta ahora: ${pb.st} de 3 necesarios.`));
  if(pb.dc<1) bits.push(B('Add at least 1 yes or no question.','Agrega al menos 1 pregunta de sí o no.'));
  if(!pb.txtOk) bits.push(B('Fill in every box with at least 3 letters.','Llena cada casilla con al menos 3 letras.'));
  return bits.length?`<div class="msg warn">${bits.join('')}</div>`:`<div class="msg good">${B('Your chart is ready.','Tu diagrama está listo.')}</div>`;
}

function viewRefl(){
  const ok=S.refl.trim().length>=15;
  return `${stepper('refl')}
  <section class="card">
    <h2>${B('Reflect','Reflexiona')}</h2>
    <p class="lead">${B('How did splitting things into parts, steps, and yes or no questions help you? What was the hardest part of building your chart?','¿Cómo te ayudó dividir las cosas en partes, pasos y preguntas de sí o no? ¿Qué fue lo más difícil de armar tu diagrama?')}</p>
    <textarea id="inRefl" aria-label="Reflection" placeholder="It helped me… The hardest part was…  /  Me ayudó… Lo más difícil fue…">${esc(S.refl)}</textarea>
    <p class="muted" style="margin:6px 0 0">${B('You can write in English or Spanish.','Puedes escribir en inglés o en español.')}</p>
    <div class="row" style="margin-top:14px"><button class="btn" id="btnRefl" data-act="next" data-to="turnin" ${ok?'':'disabled'}>${B('Go to turn in','Ir a entregar')}</button></div>
  </section>`;
}

function outline(){
  const p3=S.p3; const L=[]; L.push('START: '+probText());
  p3.blocks.forEach((b,i)=>{
    if(b.t==='step') L.push((i+1)+'. STEP: '+b.a.trim());
    else L.push((i+1)+'. QUESTION: '+b.a.trim()+'  | YES: '+b.y.trim()+'  | NO: '+b.n.trim());
  });
  L.push('END: Problem solved'); return L.join('\n');
}
function brk(P){const o=outcomeOf(P); return `${o.first} right on 1st check, ${o.second} fixed on 2nd check, ${o.revealed} revealed`;}
function summary(){
  const L=['BREAK IT DOWN — Unit 4, Lesson 2','Name: '+S.name.trim()+'   Period: '+(S.period.trim()||'—'),'Date: '+new Date().toLocaleString(),''];
  L.push('PART 1 (12 party tasks into 4 groups): '+(S.p1.status==='done'?brk(S.p1):'not finished'));
  L.push('PART 2 (fill in the phone chart, 6 blocks): '+(S.p2.status==='done'?brk(S.p2):'not finished'));
  L.push('','PART 3 — MY CHART:',outline(),'','REFLECTION:',S.refl.trim());
  return L.join('\n');
}
function viewTurnin(){return `${stepper('turnin')}
  <section class="card">
    <h2>${B('Turn it in','Entrégalo')}</h2>
    <div class="stats">
      <div class="stat"><span class="big" style="font-size:22px">${B('Part 1','Parte 1')}</span><span class="muted">${esc(brk(S.p1))}</span></div>
      <div class="stat"><span class="big" style="font-size:22px">${B('Part 2','Parte 2')}</span><span class="muted">${esc(brk(S.p2))}</span></div>
    </div>
    <ol style="padding-left:22px;margin:8px 0 0">
      <li style="margin-bottom:8px">${B('Press Download my PDF.','Presiona Descargar mi PDF.')}</li>
      <li style="margin-bottom:8px">${B('Open the Canvas assignment and choose File Upload.','Abre la tarea en Canvas y elige Subir archivo.')}</li>
      <li>${B('Upload the PDF, then press Submit.','Sube el PDF y presiona Enviar.')}</li></ol>
    <div class="row" style="margin-top:14px"><button class="btn" id="btnPdf" data-act="pdf">${B('Download my PDF','Descargar mi PDF')}</button><span id="pdfmsg" class="copied" role="status"></span></div>
    <details style="margin-top:16px"><summary style="cursor:pointer">${B('Trouble downloading? Copy as text instead','¿Problemas para descargar? Copia como texto')}</summary>
      <textarea id="sumbox" class="sumbox" readonly aria-label="Summary" style="margin-top:10px">${esc(summary())}</textarea>
      <div class="row" style="margin-top:10px"><button class="btn ghost small" data-act="copy">${B('Copy as text','Copiar como texto')}</button><span id="copymsg" class="copied" role="status"></span></div></details>
  </section>
  <section class="card"><h2>${B('Your chart','Tu diagrama')}</h2><div class="prev">${previewHTML()}</div></section>
  <button class="reset" data-act="reset">${B('Start over (clears this device)','Empezar de nuevo (borra este dispositivo)','inline')}</button>`;}
function PDFNAME(){return 'U4L02_BreakItDown_'+PDFLIB.fold(S.name)+'.pdf';}
function brkB(P){const o=outcomeOf(P); return [`Right on 1st check / Bien en la 1.ª revisión: ${o.first}`,`Fixed on 2nd check / Corregidas en la 2.ª revisión: ${o.second}`,`Revealed / Mostradas: ${o.revealed}`];}
function drawChart(d){
  const cx=d.W/2, sz=10, lead=sz*1.2, AR=18;
  const items=[{k:'oval',t:probText()}];
  S.p3.blocks.forEach(b=>items.push(b.t==='step'?{k:'rect',t:b.a.trim()}:{k:'dec',t:b.a.trim(),y:b.y.trim(),n:b.n.trim()}));
  items.push({k:'oval',t:'Problem solved / Problema resuelto'});
  d.newPage(); d.heading('My chart','Mi diagrama');
  let first=true;
  items.forEach((it,idx)=>{
    let h,lines;
    if(it.k==='dec'){ lines=d.wrap(it.t,'F1',sz,170); h=Math.max(78,lines.length*lead+46); }
    else { lines=d.wrap(it.t,'F1',sz,it.k==='oval'?250:270); h=lines.length*lead+16; }
    let bh=0, yl=[], nl=[];
    if(it.k==='dec'){ yl=d.wrap(it.y,'F1',sz,176); nl=d.wrap(it.n,'F1',sz,176); bh=Math.max(yl.length,nl.length)*lead+16; }
    const need=h+(it.k==='dec'?AR+18+bh+AR+10:AR)+6;
    if(d.y()+need>d.H-d.M){ d.newPage(); d.text('(continued / continuación)',d.M,d.y()+10,'F3',10,PDFLIB.GRAY); d.setY(d.y()+22); first=true; }
    let top=d.y();
    if(!first) { /* arrow drawn by previous block end */ }
    if(it.k==='oval'){ d.box(cx-150,top,300,h,h/2,PDFLIB.MINT); d.centerLines(lines,cx,top,h,sz); d.setY(top+h); }
    else if(it.k==='rect'){ d.box(cx-150,top,300,h,8,PDFLIB.WHITE); d.centerLines(lines,cx,top,h,sz); d.setY(top+h); }
    else {
      d.diamond(cx,top,340,h,PDFLIB.AMBER); d.centerLines(lines,cx,top,h,sz); const bot=top+h, bt=bot+AR+14;
      d.seg(cx,bot,cx-105,bt); d.seg(cx,bot,cx+105,bt);
      d.text('YES / SÍ',cx-205,bt-4,'F2',9,PDFLIB.TEAL); d.text('NO',cx+205-sw0('NO',9),bt-4,'F2',9,PDFLIB.TEAL);
      d.box(cx-205,bt,200,bh,8,PDFLIB.WHITE); d.centerLines(yl,cx-105,bt,bh,sz);
      d.box(cx+5,bt,200,bh,8,PDFLIB.WHITE); d.centerLines(nl,cx+105,bt,bh,sz);
      const be=bt+bh; d.seg(cx-105,be,cx,be+10); d.seg(cx+105,be,cx,be+10); d.arrow(cx,be+10,be+10+AR); d.setY(be+10+AR);
      first=false; return;
    }
    first=false;
    if(idx<items.length-1){ d.arrow(cx,d.y(),d.y()+AR); d.setY(d.y()+AR); }
  });
}
function sw0(s,size){return PDFLIB.width(s,'F2',size);}
function buildPDF(){
  const d=PDFLIB.doc(); d.title('Break It Down','Unit 4 · Lesson 2   /   Unidad 4 · Lección 2');
  d.kv('Name / Nombre',S.name.trim()); d.kv('Period / Periodo',S.period.trim()||'—'); d.kv('Date / Fecha',new Date().toLocaleString());
  d.heading('Part 1: Break a big problem into parts (12 party tasks, 4 groups)','Parte 1: Divide un problema grande en partes');
  if(S.p1.status==='done') brkB(S.p1).forEach(l=>d.line(l)); else d.line('Not finished / Sin terminar');
  d.heading('Part 2: Fill in the chart (phone that will not turn on, 6 blocks)','Parte 2: Completa el diagrama');
  if(S.p2.status==='done') brkB(S.p2).forEach(l=>d.line(l)); else d.line('Not finished / Sin terminar');
  d.heading('Part 3: My chart (text version)','Parte 3: Mi diagrama (versión en texto)');
  outline().split('\n').forEach(l=>d.para(l,{size:10.5}));
  d.heading('Reflection','Reflexión'); d.para(S.refl.trim()||'—');
  drawChart(d);
  return d.build('Break It Down - '+S.name.trim());
}
function doPDF(){
  const m=$('#pdfmsg');
  try{
    const bytes=buildPDF();
    PDFLIB.download(bytes,PDFNAME());
    m.innerHTML=B('Saved! Now upload the PDF to Canvas.','¡Guardado! Ahora sube el PDF a Canvas.','inline');
  }catch(err){
    m.innerHTML=B('The PDF did not work. Use "Copy as text" below.','El PDF no funcionó. Usa "Copiar como texto" abajo.','inline');
    const dt=document.querySelector('details'); if(dt) dt.open=true;
  }
}

/* ================= render ================= */
function render(){
  document.body.setAttribute('data-lang',S.lang); document.documentElement.lang=S.lang;
  document.querySelectorAll('.langtog button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===S.lang));
  const v={welcome:viewWelcome,p1:viewP1,p2:viewP2,p3:viewP3,refl:viewRefl,turnin:viewTurnin}[S.stage];
  $('#app').innerHTML=v(); save();
  if(S.stage==='p3') $('#p3status').innerHTML=p3Status();
}
function go(stage){S.stage=stage; render(); window.scrollTo(0,0);}
function refreshP3(){
  $('#prevwrap').innerHTML=previewHTML(); $('#p3status').innerHTML=p3Status();
  $('#btnP3').disabled=!builderProblems().ok; save();
}

/* ================= actions ================= */
function cardClick(id){
  const P=S.p1; if(P.status==='done') return;
  if(P.place[id]){P.place[id]=null; P.sel=id;}      // take it back out and hold it
  else P.sel=(P.sel===id)?null:id;
  render();
}
function groupClick(g){
  const P=S.p1; if(P.status==='done'||!P.sel) return;
  P.place[P.sel]=g; P.sel=null; render();
}
function blkClick(id){const P=S.p2; if(P.status==='done') return; P.sel=(P.sel===id)?null:id; render();}
function slotClick(sid){
  const P=S.p2; if(P.status==='done') return;
  const cur=P.place[sid];
  if(P.sel){ P.place[sid]=P.sel; P.sel=null; }       // a held block replaces whatever was there (it returns to the tray)
  else if(cur){ P.place[sid]=null; P.sel=cur; }       // empty-handed: pick the block back up
  render();
}
function doCheck(){
  if(S.stage==='p1'){runCheck(S.p1,TASKS.map(t=>t.id),TR1); render(); announce(S.p1.status==='done'?'Part 1 finished':'Check done');}
  else if(S.stage==='p2'){runCheck(S.p2,SLOTS.map(s=>s.id),TR2); render(); announce(S.p2.status==='done'?'Part 2 finished':'Check done');}
  const r=$('#result-'+S.stage); if(r) r.scrollIntoView({block:'start'});
}
function addBlock(t){ if(S.p3.blocks.length>=8) return; S.p3.blocks.push({t,a:'',y:'',n:''}); render(); }
function move(i,d){const a=S.p3.blocks,j=i+d; if(j<0||j>=a.length) return; const t=a[i]; a[i]=a[j]; a[j]=t; render();}
function del(i){ if(S.p3.blocks.length<=2) return; S.p3.blocks.splice(i,1); render(); }
function doCopy(){
  const ta=$('#sumbox'); ta.value=summary(); const m=$('#copymsg');
  const ok=()=>{m.innerHTML=B('Copied! Now paste it into Canvas.','¡Copiado! Ahora pégalo en Canvas.','inline');};
  const fb=()=>{ta.focus();ta.select();try{document.execCommand('copy');ok();}catch(e){m.innerHTML=B('Select the text and press Ctrl+C.','Selecciona el texto y presiona Ctrl+C.','inline');}};
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(ok,fb); else fb();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t||t.disabled) return; const a=t.dataset.act;
  if(a==='lang'){S.lang=t.dataset.l; render();}
  else if(a==='start'){ if(S.name.trim().length>=2) go('p1'); }
  else if(a==='card') cardClick(t.dataset.id);
  else if(a==='group') groupClick(t.dataset.id);
  else if(a==='blk') blkClick(t.dataset.id);
  else if(a==='slot') slotClick(t.dataset.id);
  else if(a==='check') doCheck();
  else if(a==='next') go(t.dataset.to);
  else if(a==='up') move(+t.dataset.i,-1);
  else if(a==='down') move(+t.dataset.i,1);
  else if(a==='del') del(+t.dataset.i);
  else if(a==='addstep') addBlock('step');
  else if(a==='adddec') addBlock('dec');
  else if(a==='copy') doCopy();
  else if(a==='pdf') doPDF();
  else if(a==='reset'){ if(confirm('Start over? This clears your work on this device. / ¿Empezar de nuevo? Esto borra tu trabajo en este dispositivo.')){try{localStorage.removeItem(KEY);}catch(x){} S=fresh(); render();} }
});
document.addEventListener('input',e=>{
  const t=e.target, id=t.id;
  if(id==='inName'){S.name=t.value; save(); const b=$('#btnStart'); if(b) b.disabled=S.name.trim().length<2;}
  else if(id==='inPeriod'){S.period=t.value; save();}
  else if(id==='inCustom'){S.p3.custom=t.value; refreshP3();}
  else if(id==='inRefl'){S.refl=t.value; save(); const b=$('#btnRefl'); if(b) b.disabled=S.refl.trim().length<15;}
  else if(t.dataset&&t.dataset.f){S.p3.blocks[+t.dataset.i][t.dataset.f]=t.value; refreshP3();}
});
document.addEventListener('change',e=>{
  if(e.target.id==='selProb'){S.p3.prob=e.target.value; const w=$('#customWrap'); if(w) w.hidden=S.p3.prob!=='other'; refreshP3();}
});

S=load();
if(!['welcome','p1','p2','p3','refl','turnin'].includes(S.stage)) S.stage='welcome';
render();
window.__S=()=>S; window.__T={tr1:TR1,tr2:TR2};
})();
</script>
</body>
</html>
