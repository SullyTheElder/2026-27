<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitch Your Game — Unit 4, Lesson 12</title>
<style>
:root{--navy:#0F2238;--navy2:#1B3553;--teal:#14907F;--teal-d:#0C6B5E;--mint:#CDEFE4;--amber:#F2B134;--amber-d:#A86F08;--coral:#E8604C;--coral-l:#FCE4DF;--bg:#EEF3F7;--line:#C9D5E0;--sub:#475C72;--ok:#0C6B5E}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Calibri,Carlito,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--navy);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Cambria,Caladea,Georgia,serif;margin:0;line-height:1.15}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* both languages always visible; toggle swaps which is primary */
.bi{display:flex;flex-direction:column}
.bi.inline{display:inline-flex;vertical-align:top}
body[data-lang="en"] .bi .en{order:1;font-weight:700}
body[data-lang="en"] .bi .es{order:2;font-style:italic;font-weight:400;font-size:.86em;color:var(--sub)}
body[data-lang="es"] .bi .es{order:1;font-weight:700}
body[data-lang="es"] .bi .en{order:2;font-style:italic;font-weight:400;font-size:.86em;color:var(--sub)}
.on-dark .bi .en,.on-dark .bi .es{color:#fff}
body[data-lang="en"] .on-dark .bi .es,body[data-lang="es"] .on-dark .bi .en{color:#BCD0E2}
.btn .bi{align-items:center;text-align:center}
.btn .bi .en,.btn .bi .es{color:inherit !important}

header{background:var(--navy);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header .back{color:#BCD0E2;text-decoration:none;font-size:15px;border:1px solid #3B5675;padding:6px 10px;border-radius:6px}
header .ttl{flex:1;min-width:180px}
header h1{font-size:26px}
header .sub{font-size:14px;color:#BCD0E2}
.langtog{display:flex;border:1px solid #3B5675;border-radius:8px;overflow:hidden}
.langtog button{background:transparent;color:#BCD0E2;border:0;padding:7px 14px;font-weight:700}
.langtog button[aria-pressed="true"]{background:var(--teal);color:#fff}
main{max-width:1000px;margin:0 auto;padding:16px 16px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:16px}
.card h2{font-size:23px;margin-bottom:8px}
.lead{font-size:18px;margin:0}
.muted{color:var(--sub)}
.stepper{display:flex;gap:6px;flex-wrap:wrap;list-style:none;padding:0;margin:14px 0 0}
.stepper li{flex:1 1 90px;min-width:84px;border-top:5px solid var(--line);padding-top:5px;font-size:13px;color:var(--sub)}
.stepper li.done{border-color:var(--teal);color:var(--teal-d)}
.stepper li.now{border-color:var(--amber);color:var(--navy)}
.stepper .bi .en,.stepper .bi .es{font-size:13px !important}
.btn{border:0;border-radius:10px;padding:11px 20px;background:var(--teal);color:#fff;min-height:48px}
.btn:hover:not(:disabled){background:var(--teal-d)}
.btn:disabled{background:#B8C6D2;color:#fff;cursor:not-allowed}
.btn.alt{background:var(--navy)}
.btn.alt:hover:not(:disabled){background:var(--navy2)}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn.amber{background:var(--amber);color:var(--navy)}
.btn.amber:hover:not(:disabled){background:#E09E1C}
.btn.amber:disabled{background:#B8C6D2;color:#fff}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hero{background:var(--navy);color:#fff;border-radius:12px;padding:26px 22px;margin-top:16px}
.hero h2{font-size:34px;margin-bottom:10px;color:#fff}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:16px}
.how>div{background:var(--navy2);border-radius:10px;padding:12px 14px}
.how .n{font-family:Cambria,Caladea,Georgia,serif;font-size:26px;color:var(--amber);display:block}
label.f{display:block;margin-top:14px}
label.f .bi{margin-bottom:4px}
input[type=text],textarea{width:100%;border:2px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;min-height:46px}
input[type=text]:focus,textarea:focus{border-color:var(--teal)}
textarea{min-height:120px;resize:vertical}
.fields{display:grid;grid-template-columns:2fr 1fr;gap:12px;max-width:520px}
@media (max-width:620px){.fields{grid-template-columns:1fr}}
.msg.good{color:var(--ok)}
.msg.warn{color:#8A3A00}

/* Part 1: number game */
.guessrow{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.guessrow .gin{width:170px}
.guessrow input{font-size:28px;text-align:center;font-weight:700}
.fb{min-height:64px;margin:12px 0;font-size:20px}
.fb .big{font-family:Cambria,Caladea,Georgia,serif;font-size:30px;font-weight:700}
.fb.up .big{color:var(--teal-d)}
.fb.down .big{color:#9A3412}
.fb.win .big{color:var(--ok)}
.log{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.log li{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.log li.dup{background:var(--coral-l);border-color:var(--coral)}
.log .tag{font-size:12px;font-weight:700;color:#A12C1B}
.rangebar{position:relative;height:30px;background:#fff;border:2px solid var(--navy);border-radius:8px;overflow:hidden;margin:6px 0}
.rangebar .fill{position:absolute;top:0;bottom:0;background:var(--mint);border-left:3px solid var(--teal);border-right:3px solid var(--teal)}
.rangelab{display:flex;justify-content:space-between;font-size:14px;color:var(--sub)}

/* Part 2: card wall */
.target{display:inline-flex;align-items:baseline;gap:10px;background:var(--navy);color:#fff;border-radius:10px;padding:8px 16px}
.target .num{font-family:Cambria,Caladea,Georgia,serif;font-size:34px;font-weight:700;color:var(--amber)}
.wall{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:12px}
@media (max-width:620px){.wall{grid-template-columns:repeat(4,1fr)}}
.tile{aspect-ratio:1/1.1;min-height:56px;border-radius:10px;border:3px solid var(--navy);font-family:Cambria,Caladea,Georgia,serif;font-weight:700;font-size:22px;display:flex;align-items:center;justify-content:center;padding:0}
.tile.down{background:var(--amber);box-shadow:0 3px 0 var(--amber-d);color:var(--navy)}
.tile.down:hover:not(:disabled){transform:translateY(-2px)}
.tile.down .pos{font-size:16px;background:#fff;border:2px solid var(--navy);border-radius:6px;min-width:30px;padding:0 4px}
.tile.up{background:#fff;color:var(--navy)}
.tile.up.found{background:var(--mint);border-color:var(--teal);outline:4px solid var(--teal)}
.tile.up.bad{border-color:var(--coral)}
.tile.rev{background:#F6F9FB;color:var(--sub);border-style:dashed;border-color:var(--line)}
.tile:disabled{cursor:default}
.tilepos{display:block;font-size:11px;font-weight:400;color:var(--sub);font-family:Calibri,Carlito,sans-serif}

/* results */
.result{border:3px solid var(--teal)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:10px 0}
.stat{background:var(--bg);border-radius:10px;padding:10px 14px}
.stat .big{font-family:Cambria,Caladea,Georgia,serif;font-size:34px;font-weight:700;display:block;line-height:1.1}
.bars{margin-top:8px}
.bar{display:grid;grid-template-columns:minmax(150px,240px) 1fr 40px;gap:10px;align-items:center;margin:6px 0}
.bar .track{background:var(--bg);border-radius:6px;height:20px;overflow:hidden}
.bar .fill{height:100%;border-radius:6px}
.bar .num{font-weight:700;text-align:right}
@media (max-width:560px){.bar{grid-template-columns:1fr 1fr 34px}}
.strats{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:10px}
.strat{text-align:left;background:#fff;border:3px solid var(--line);border-radius:12px;padding:12px 14px}
.strat:hover{border-color:var(--teal)}
.strat[aria-pressed="true"]{border-color:var(--teal);background:var(--mint)}
.strat .h{font-family:Cambria,Caladea,Georgia,serif;font-size:19px;margin-bottom:4px}
.strat .bi .en,.strat .bi .es{font-weight:400}
body[data-lang="en"] .strat .bi .en{font-weight:600}
body[data-lang="es"] .strat .bi .es{font-weight:600}
body[data-lang="en"] .strat .h .bi .en,body[data-lang="es"] .strat .h .bi .es{font-weight:700}
.sumbox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;min-height:240px;background:#F6F9FB}
.copied{color:var(--ok);font-weight:700}
.challenge{border:3px dashed var(--amber)}
.reset{background:none;border:0;color:var(--sub);text-decoration:underline;font-size:14px;margin-top:22px}

/* ---- Build a Feed ---- */
.persona{background:var(--mint);border-radius:12px;padding:14px 16px;margin-top:12px}
.sliders{display:flex;flex-direction:column;gap:14px}
.sl{border-bottom:1px solid var(--line);padding-bottom:12px}
.sl:last-child{border-bottom:0}
.sl .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sl output{font-family:Cambria,Caladea,Georgia,serif;font-size:26px;font-weight:700;color:var(--teal-d);min-width:28px;text-align:right}
.sl input[type=range]{width:100%;accent-color:#14907F;height:34px}
.sl .hint{font-size:14px;color:var(--sub)}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.layout{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.meter{background:var(--navy);color:#fff;border-radius:12px;padding:12px 16px;margin-bottom:12px}
.meter .big{font-family:Cambria,Caladea,Georgia,serif;font-size:38px;font-weight:700;color:var(--amber);line-height:1}
.meter .goal{height:14px;background:#2B476A;border-radius:7px;position:relative;margin-top:8px;overflow:hidden}
.meter .goal .bar{position:absolute;left:0;top:0;bottom:0;background:var(--amber);border-radius:7px}
.meter .goal .line{position:absolute;top:-2px;bottom:-2px;width:3px;background:#fff}
.meter.win .big{color:#7CE8C9}
.meter.win .goal .bar{background:#7CE8C9}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.post{display:grid;grid-template-columns:38px 1fr 54px;gap:10px;align-items:start;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.post.in{border-color:var(--teal);background:#F7FCFA}
.post.out{opacity:.62}
.post.wanted{box-shadow:inset 6px 0 0 var(--teal)}
.post .rank{font-family:Cambria,Caladea,Georgia,serif;font-size:24px;font-weight:700;color:var(--navy2)}
.post .who{font-size:14px;color:var(--sub);margin-bottom:2px}
.post .txt{font-size:16px}
.post .txt .bi .en,.post .txt .bi .es{font-weight:400}
body[data-lang="en"] .post .txt .bi .en{font-weight:600}
body[data-lang="es"] .post .txt .bi .es{font-weight:600}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.bdg{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--bg);color:var(--navy2);font-weight:600}
.bdg.hot{background:var(--coral-l);border-color:var(--coral);color:#8A2A1A}
.bdg.ad{background:#FFF3D6;border-color:var(--amber);color:#7A5200}
.delta{font-weight:700;font-size:15px;text-align:right}
.delta.up{color:var(--teal-d)} .delta.down{color:#9A3412}
.cut{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:14px;margin:4px 0}
.cut:before,.cut:after{content:"";flex:1;border-top:3px dashed var(--coral)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:860px){.cols2{grid-template-columns:1fr}}
.wlist{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.wlist>span{display:inline-flex;gap:6px;align-items:baseline;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:14px;font-weight:700}
.poll{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:10px}
.poll button{text-align:left;background:#fff;border:3px solid var(--line);border-radius:12px;padding:10px 14px}
.poll button:hover{border-color:var(--teal)}
.poll button[aria-pressed="true"]{border-color:var(--teal);background:var(--mint)}


/* ---- Who Gets Flagged ---- */
.grp{margin-top:10px}
.grp h4{margin:0 0 6px;font-family:Cambria,Caladea,Georgia,serif;font-size:17px;color:var(--navy2)}
.tiles{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
@media (max-width:620px){.tiles{grid-template-columns:repeat(5,1fr)}}
.tile2{position:relative;border:2px solid var(--line);background:#fff;border-radius:8px;padding:6px 0;font-size:13px;font-weight:700;color:var(--sub);min-height:44px}
.tile2.flag{background:var(--amber);border-color:var(--navy);color:var(--navy);box-shadow:0 2px 0 var(--amber-d)}
.tile2.sel{outline:4px solid var(--teal);outline-offset:1px}
.tile2.need:after{content:"●";position:absolute;right:4px;top:0;color:#0C6B5E;font-size:14px}
.tile2.fa{border-color:var(--coral);background:var(--coral-l);color:#8A2A1A}
.tile2.miss{border-style:dashed;border-color:var(--teal)}
.legend2{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:14px;margin-top:10px;color:var(--sub)}
.legend2 i{display:inline-block;width:14px;height:14px;border-radius:4px;border:2px solid var(--navy);vertical-align:-2px;margin-right:5px}
.inspect{background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:10px;min-height:64px}
.m3{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:8px}
.m3>div{background:#1B3553;border-radius:8px;padding:6px 10px}
.m3 .v{font-family:Cambria,Caladea,Georgia,serif;font-size:26px;font-weight:700;color:var(--amber);line-height:1.1}
.m3 .l{font-size:12px;color:#BCD0E2}
.m3 .ok .v{color:#7CE8C9}
.chk{font-size:15px;margin-top:8px}


/* ---- Clean It Up ---- */
.dtab{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.drow{display:grid;grid-template-columns:76px minmax(90px,1fr) 205px 84px 235px;gap:8px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:10px;padding:6px 10px}
.drow.head{background:transparent;border:0;font-weight:700;color:var(--sub);padding-top:0;padding-bottom:0;font-size:14px}
.drow .id{font-weight:700;font-size:14px;color:var(--navy2)}
.drow .id small{display:block;font-weight:400;color:var(--sub)}
.drow .raw{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;font-weight:700;background:var(--bg);border-radius:6px;padding:4px 8px;overflow-wrap:anywhere}
.drow .raw.blank{color:var(--sub);font-style:italic;font-weight:400}
.drow select,.drow input[type=text]{min-height:40px;padding:6px 8px;font-size:15px}
.drow.right{border-color:var(--teal);background:#F7FCFA}
.drow.wrong{border-color:var(--coral);background:var(--coral-l)}
.drow:has(select[data-f="act"] option[value="keep"]:checked){border-color:#9DB4C8}
@media (max-width:760px){.drow{grid-template-columns:1fr 1fr}.drow.head{display:none}.drow .raw,.drow .id{grid-column:1/-1}}
.m2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
.m2>div{background:#1B3553;border-radius:8px;padding:8px 12px}
.m2 .v{font-family:Cambria,Caladea,Georgia,serif;font-size:30px;font-weight:700;color:var(--amber);line-height:1.1}
.m2 .l{font-size:13px;color:#BCD0E2}
.m2 .good .v{color:#7CE8C9}
.chartbox{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px;overflow-x:auto}
.chartbox svg{width:100%;height:auto;min-width:420px}
.opts{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.opts label{display:block}
select.s1{width:auto;min-width:170px}


/* ---- Make the Chart Lie ---- */
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 14px;margin-top:6px}
.ctrls label{display:block}
.ctrls select{min-height:42px}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:860px){.two2{grid-template-columns:1fr}}
.chip{display:inline-block;background:var(--coral-l);border:1px solid var(--coral);color:#8A2A1A;border-radius:999px;padding:2px 10px;font-size:14px;font-weight:700;margin:2px 4px 2px 0}
.chip.none{background:var(--bg);border-color:var(--line);color:var(--sub);font-weight:400}
.on-dark .chip .bi .en,.on-dark .chip .bi .es{color:#8A2A1A !important;font-size:14px !important}
.on-dark .chip.none .bi .en,.on-dark .chip.none .bi .es{color:#475C72 !important}
.itemgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;margin-top:12px}
.item{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.item.right{border-color:var(--teal);background:#F7FCFA}
.item .claimline{font-size:16px;margin:4px 0 6px}
.item svg{width:100%;height:auto;display:block}
.item .note{font-size:13px;color:var(--sub);margin-top:4px}
.item select{margin-top:8px}
.honest{border:2px dashed var(--teal);background:#F7FCFA}
.two2>*,.itemgrid>*,.ctrls>*{min-width:0}
.item select,.ctrls select{max-width:100%;text-overflow:ellipsis}


/* ---- Honest Infographic ---- */
.poster{border:3px solid var(--navy);border-radius:14px;overflow:hidden;background:#fff}
.poster .band{padding:16px 18px;color:#fff}
.poster .band h3{font-family:Cambria,Caladea,Georgia,serif;font-size:26px;line-height:1.1;margin:0;color:#fff;overflow-wrap:anywhere}
.poster .band p{margin:6px 0 0;font-size:16px;opacity:.95;overflow-wrap:anywhere}
.poster .body{padding:12px 14px}
.poster .facts{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:10px}
@media (max-width:620px){.poster .facts{grid-template-columns:1fr}}
.poster .fact{border-radius:10px;padding:10px 12px}
.poster .fact .num{font-family:Cambria,Caladea,Georgia,serif;font-size:34px;font-weight:700;line-height:1}
.poster .small{font-size:12px;color:#475C72;margin-top:8px}
.checks{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.checks li{display:flex;gap:10px;align-items:flex-start;background:#fff;border:2px solid var(--line);border-radius:10px;padding:6px 10px}
.checks li.ok{border-color:var(--teal);background:#F7FCFA}
.checks li.bad{border-color:var(--coral);background:var(--coral-l)}
.checks li.tip{border-style:dashed}
.checks .ic{font-weight:700;font-size:18px;min-width:22px}
.qrow{background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
.qrow .opts2{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.qrow .opts2 button{border:3px solid var(--line);background:#fff;border-radius:10px;padding:6px 14px;font-weight:700}
.qrow .opts2 button[aria-pressed="true"]{border-color:var(--teal);background:var(--mint)}
.swatch{display:inline-flex;gap:6px;align-items:center}
.swatch i{width:18px;height:18px;border-radius:5px;border:2px solid #0F2238;display:inline-block}
@media (min-width:861px){#posterbox{position:sticky;top:10px}}
.fb{background:#FFF3D6;border:2px solid var(--amber);border-radius:10px;padding:10px 14px;margin-top:10px}


/* ---- Pitch Your Game ---- */
.engines{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:10px}
.engines button{text-align:left;border:3px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px}
.engines button[aria-pressed="true"]{border-color:var(--teal);background:var(--mint)}
.engines .nm{font-family:Cambria,Caladea,Georgia,serif;font-size:20px;font-weight:700;color:var(--navy2)}
.engines .fr{font-size:12px;color:var(--sub);margin-top:4px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* ===== tiny dependency-free PDF writer (Helvetica, WinAnsi, vector shapes) ===== */
const PDFLIB=(function(){
  const R=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,
    667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,
    556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
  const BD=[278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,
    722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,
    556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584];
  const MAP={'\u2018':0x91,'\u2019':0x92,'\u201C':0x93,'\u201D':0x94,'\u2013':0x96,'\u2014':0x97,'\u2026':0x85,'\u2022':0x95};
  function cw(ch,font){
    let c=ch.codePointAt(0);
    if(c<32||c>126){ if(ch==='\u00BF') c=63; else if(ch==='\u00A1') c=33; else { const b=ch.normalize('NFD')[0].codePointAt(0); c=(b>=32&&b<=126)?b:110; } }
    const tab=font==='F2'?BD:R; return (tab[c-32]||556)/1000;
  }
  function sw(s,font,size){let w=0; for(const ch of s) w+=cw(ch,font); return w*size;}
  function enc(s){
    let o=''; s=String(s).normalize('NFC');
    for(const ch of s){
      let c=ch.codePointAt(0);
      if(MAP[ch]) c=MAP[ch]; else if(c>255) c=63;
      if(c===40||c===41||c===92) o+='\\'+String.fromCharCode(c);
      else if(c<32) o+=' ';
      else if(c>126) o+='\\'+c.toString(8).padStart(3,'0');
      else o+=String.fromCharCode(c);
    } return o;
  }
  function wrap(s,font,size,maxW){
    const out=[];
    String(s).split(/\r?\n/).forEach(par=>{
      let line='';
      par.split(/\s+/).filter(Boolean).forEach(w0=>{
        let w=w0;
        while(sw(w,font,size)>maxW){            // break very long words
          let k=1; while(k<w.length&&sw(w.slice(0,k+1),font,size)<=maxW) k++;
          if(line){out.push(line); line='';}
          out.push(w.slice(0,k)); w=w.slice(k);
        }
        const t=line?line+' '+w:w;
        if(sw(t,font,size)<=maxW) line=t; else {out.push(line); line=w;}
      });
      out.push(line);
    });
    return out;
  }
  const NAVY=[0.059,0.133,0.22], TEAL=[0.047,0.42,0.369], GRAY=[0.28,0.36,0.45], MINT=[0.804,0.937,0.894], AMBER=[0.992,0.941,0.816], WHITE=[1,1,1];
  function doc(){
    const W=612,H=792,M=54; const pages=[]; let cur=null; let y=M;
    const f=n=>(Math.round(n*100)/100).toString();
    const col=(c,s)=>`${f(c[0])} ${f(c[1])} ${f(c[2])} ${s?'RG':'rg'}\n`;
    const d={W,H,M};
    d.newPage=()=>{ if(cur!==null) pages.push(cur); cur=''; y=M; };
    d.y=()=>y; d.setY=v=>{y=v;};
    d.ensure=h=>{ if(cur===null||y+h>H-M) d.newPage(); };
    d.text=(s,x,base,font,size,c)=>{ cur+=col(c||NAVY,false)+`BT /${font} ${size} Tf ${f(x)} ${f(H-base)} Td (${enc(s)}) Tj ET\n`; };
    d.textC=(s,cx,base,font,size,c)=>{ d.text(s,cx-sw(s,font,size)/2,base,font,size,c); };
    d.title=(en,sub)=>{ d.ensure(60); d.text(en,M,y+20,'F2',22,NAVY); d.text(sub,M,y+38,'F3',11,GRAY); y+=54; };
    d.kv=(k,v)=>{ d.ensure(18); d.text(k+':',M,y+11,'F2',11,NAVY); const lines=wrap(v,'F1',11,W-2*M-150);
      lines.forEach((l,i)=>{ if(i>0) d.ensure(15); d.text(l,M+150,y+11,'F1',11,NAVY); y+=15; }); if(!lines.length) y+=15; };
    d.gap=n=>{y+=n;};
    d.heading=(en,es)=>{ d.ensure(52); y+=10; d.text(en,M,y+12,'F2',13,TEAL); d.text(es,M,y+26,'F3',10.5,GRAY);
      cur+=col(TEAL,true)+`0.8 w ${M} ${f(H-(y+31))} m ${W-M} ${f(H-(y+31))} l S\n`; y+=40; };
    d.para=(s,o)=>{ o=o||{}; const size=o.size||11, font=o.font||'F1', lead=size*1.35, w=W-2*M-(o.indent||0);
      wrap(s,font,size,w).forEach(l=>{ d.ensure(lead+2); d.text(l,M+(o.indent||0),y+size,font,size,o.color||NAVY); y+=lead; }); y+=4; };
    d.line=(s,o)=>d.para(s,o);
    /* ---- shapes (top-left coordinates) ---- */
    function rr(x,top,w,h,r){const k=0.5523*r,X=x,Y=H-top;
      return `${f(X+r)} ${f(Y)} m ${f(X+w-r)} ${f(Y)} l ${f(X+w-r+k)} ${f(Y)} ${f(X+w)} ${f(Y-r+k)} ${f(X+w)} ${f(Y-r)} c ${f(X+w)} ${f(Y-h+r)} l `+
        `${f(X+w)} ${f(Y-h+r-k)} ${f(X+w-r+k)} ${f(Y-h)} ${f(X+w-r)} ${f(Y-h)} c ${f(X+r)} ${f(Y-h)} l ${f(X+r-k)} ${f(Y-h)} ${f(X)} ${f(Y-h+r-k)} ${f(X)} ${f(Y-h+r)} c `+
        `${f(X)} ${f(Y-r)} l ${f(X)} ${f(Y-r+k)} ${f(X+r-k)} ${f(Y)} ${f(X+r)} ${f(Y)} c h\n`;}
    d.box=(x,top,w,h,r,fill)=>{ cur+='q\n'+col(fill,false)+col(NAVY,true)+'1.2 w\n'+rr(x,top,w,h,Math.min(r,h/2,w/2))+'B\nQ\n'; };
    d.diamond=(cx,top,w,h,fill)=>{ const Y=H-top; cur+='q\n'+col(fill,false)+col(NAVY,true)+`1.2 w\n${f(cx)} ${f(Y)} m ${f(cx+w/2)} ${f(Y-h/2)} l ${f(cx)} ${f(Y-h)} l ${f(cx-w/2)} ${f(Y-h/2)} l h B\nQ\n`; };
    d.seg=(x1,y1,x2,y2)=>{ cur+='q\n'+col(NAVY,true)+`1.2 w ${f(x1)} ${f(H-y1)} m ${f(x2)} ${f(H-y2)} l S\nQ\n`; };
    d.arrow=(x,y1,y2)=>{ d.seg(x,y1,x,y2-4); cur+='q\n'+col(NAVY,false)+`${f(x-4)} ${f(H-(y2-6))} m ${f(x+4)} ${f(H-(y2-6))} l ${f(x)} ${f(H-y2)} l f\nQ\n`; };
    d.centerLines=(lines,cx,top,h,size,font,c)=>{ const lead=size*1.2, tot=lines.length*lead; let b=top+(h-tot)/2+lead*0.78;
      lines.forEach(l=>{ d.textC(l,cx,b,font||'F1',size,c); b+=lead; }); };
    d.wrap=(s,font,size,w)=>wrap(s,font,size,w);
    d.build=title=>{
      if(cur!==null) pages.push(cur); if(!pages.length) pages.push('');
      const n=pages.length, objs=[]; const kids=[];
      objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
      for(let i=0;i<n;i++) kids.push((6+2*i)+' 0 R');
      objs[2]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${n} >>`;
      objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
      objs[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
      objs[5]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>';
      pages.forEach((p,i)=>{
        objs[6+2*i]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R >> >> /Contents ${7+2*i} 0 R >>`;
        objs[7+2*i]=`<< /Length ${p.length} >>\nstream\n${p}endstream`;
      });
      const info=6+2*n; objs[info]=`<< /Title (${enc(title||'')}) /Producer (Class Resources Site) >>`;
      let out='%PDF-1.4\n%\u00E2\u00E3\u00CF\u00D3\n'; const off=[];
      for(let i=1;i<=info;i++){ off[i]=out.length; out+=`${i} 0 obj\n${objs[i]}\nendobj\n`; }
      const xr=out.length; out+=`xref\n0 ${info+1}\n0000000000 65535 f \n`;
      for(let i=1;i<=info;i++) out+=String(off[i]).padStart(10,'0')+' 00000 n \n';
      out+=`trailer\n<< /Size ${info+1} /Root 1 0 R /Info ${info} 0 R >>\nstartxref\n${xr}\n%%EOF`;
      const u=new Uint8Array(out.length); for(let i=0;i<out.length;i++) u[i]=out.charCodeAt(i)&255; return u;
    };
    d.newPage();
    return d;
  }
  function fold(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'')||'student';}
  function download(bytes,name){
    const blob=new Blob([bytes],{type:'application/pdf'}), url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},2000);
  }
  return {doc,fold,download,width:sw,NAVY,TEAL,GRAY,MINT,AMBER,WHITE};
})();

const KEY='u4l12-pitchyourgame-v1';
const B=(en,es,c)=>`<span class="bi${c?' '+c:''}"><span class="en">${en}</span><span class="es">${es}</span></span>`;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const hex=h=>[parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255];

/* ================= content ================= */
const ENGINES=[
 {id:'sort',n:['Sort','Ordenar'],d:['Players put things in order using a fixed rule, like comparing two at a time.','Los jugadores ponen cosas en orden con una regla fija, como comparar de dos en dos.'],from:['Sort It Out','Ordénalo'],kw:['order','sort','swap','compare','smallest','largest','rank','line up','arrange'],ex:['Race to line up 8 cards from smallest to largest, comparing only two at a time.','Carrera para ordenar 8 cartas de menor a mayor, comparando solo dos a la vez.']},
 {id:'search',n:['Search','Buscar'],d:['Players hunt for a hidden target, and every clue cuts the possibilities down.','Los jugadores buscan un objetivo escondido y cada pista reduce las posibilidades.'],from:['Find It Fast','Encuéntralo rápido'],kw:['guess','higher','lower','middle','half','hidden','clue','narrow','find'],ex:['Guess the hidden card. After each guess, say higher or lower, then guess the middle of what is left.','Adivina la carta escondida. Después de cada intento, di mayor o menor y adivina el punto medio de lo que queda.']},
 {id:'rank',n:['Rank','Clasificar'],d:['A scoring rule decides who or what comes first.','Una regla de puntos decide quién o qué va primero.'],from:['Build a Feed','Arma un feed'],kw:['score','points','weight','rank','top','highest','feed','order'],ex:['Each card earns points from three weights. The highest total goes first this round.','Cada carta gana puntos según tres pesos. El total más alto va primero esta ronda.']},
 {id:'decide',n:['Decide','Decidir'],d:['Every turn follows if-then rules, like a flowchart.','Cada turno sigue reglas si-entonces, como un diagrama de flujo.'],from:['Break It Down','Descomponlo'],kw:['if','then','otherwise','else','path','branch','choose'],ex:['At each room, if the door is red then go left, otherwise go right, until you reach the exit.','En cada cuarto, si la puerta es roja ve a la izquierda, si no ve a la derecha, hasta llegar a la salida.']},
 {id:'predict',n:['Predict','Predecir'],d:['Players use data to predict a hidden outcome, then check how close they were.','Los jugadores usan datos para predecir un resultado oculto y luego revisan qué tan cerca estuvieron.'],from:['Predict First','Predice primero'],kw:['predict','guess','data','estimate','average','pattern','closest'],ex:['Look at past scores, predict the next one, and the closest prediction wins the round.','Mira notas pasadas, predice la siguiente y la predicción más cercana gana la ronda.']}];
const EB={}; ENGINES.forEach(x=>EB[x.id]=x);
const PAL=[{id:'teal',n:['Teal','Verde azulado'],band:'#0F2238',acc:'#14907F',soft:'#CDEFE4'},{id:'sunset',n:['Sunset','Atardecer'],band:'#7A1F3D',acc:'#E8604C',soft:'#FCE4DF'},{id:'ocean',n:['Ocean','Océano'],band:'#0B3C5D',acc:'#328CC1',soft:'#D9ECF7'},{id:'forest',n:['Forest','Bosque'],band:'#1E3D2F',acc:'#4C9A5B',soft:'#DFF0E3'}];
const PB={}; PAL.forEach(p=>PB[p.id]=p);
const TESTS=[['play3','Playtest with at least 3 different people','Probar con al menos 3 personas distintas'],['count','Count how many turns a round takes','Contar cuántos turnos dura una ronda'],['fair','Check that no player wins every time','Revisar que ningún jugador gane siempre'],['time','Time a full round','Cronometrar una ronda completa'],['confuse','Ask players what confused them','Preguntar a los jugadores qué los confundió']];
const TB={}; TESTS.forEach(t=>TB[t[0]]=t);
const BUILDS=[['paper','A paper or card game I can play in class','Un juego de papel o cartas que se pueda jugar en clase'],['board','A board game with pieces I make','Un juego de mesa con piezas que yo haga'],['digital','A digital game, with AI helping me (I will read and test its code)','Un juego digital, con ayuda de IA (leeré y probaré su código)']];
const BLD={}; BUILDS.forEach(b=>BLD[b[0]]=b);
const PQ=[['Could you play the game from just these steps?','¿Podrías jugar solo con estos pasos?'],['Can you point to the step where the algorithm is?','¿Puedes señalar el paso donde está el algoritmo?'],['Is it fair? No player always wins and cheating is hard.','¿Es justo? Ningún jugador siempre gana y es difícil hacer trampa.'],['Does it sound fun to play?','¿Suena divertido para jugar?']];
const PA=[['yes','Yes','Sí'],['no','No','No'],['unsure','Not sure','No estoy seguro']];
const DECIDE=/\b(if|otherwise|else|when|unless|then)\b/i, REPEAT=/\b(repeat|again|until|each|every|while|keep|continue|next player|round)\b/i;

/* ================= state ================= */
function fresh(){return {v:1,name:'',period:'',lang:'en',stage:'welcome',d:{eng:'',name:'',tag:'',pal:'teal',players:'2',pieces:'',steps:'',win:'',algo:'',brk:'',tests:{},build:''},peer:{name:'',a:['','','',''],sug:''},rev:false,change:'',peerDone:false};}
let S;
function load(){try{const o=JSON.parse(localStorage.getItem(KEY)); if(o&&o.v===1&&o.d&&o.peer) return o;}catch(e){} return fresh();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const list=s=>s.split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean);
const stepLines=s=>s.split('\n').map(x=>x.trim().replace(/^\s*(?:\d+[\.\)\-:]|[-*•])\s*/,'')).filter(Boolean);
const len=s=>s.trim().length;

/* ================= checks ================= */
function algoChecks(){
  const d=S.d, st=stepLines(d.steps), joined=st.join(' '), eng=EB[d.eng], out=[];
  out.push({k:'eng',ok:!!eng,en:'You picked an algorithm engine',es:'Elegiste un motor de algoritmo'});
  out.push({k:'pieces',ok:list(d.pieces).length>=4,en:`4 or more pieces or data items (you have ${list(d.pieces).length})`,es:`4 o más piezas o datos (tienes ${list(d.pieces).length})`});
  out.push({k:'steps',ok:st.length>=4&&st.length<=10,en:`4 to 10 steps in one turn (you have ${st.length})`,es:`De 4 a 10 pasos en un turno (tienes ${st.length})`});
  out.push({k:'decide',ok:DECIDE.test(joined),en:'At least one decision (an if, otherwise, or when step)',es:'Al menos una decisión (un paso con si, si no o cuando)'});
  out.push({k:'repeat',ok:REPEAT.test(joined),en:'A repeat (until, again, each, every, or keep going)',es:'Una repetición (hasta, otra vez, cada o seguir)'});
  const hit=eng?eng.kw.some(w=>joined.toLowerCase().includes(w)):true;
  out.push({k:'tip',tip:true,ok:hit,en:hit?`Your steps use the ${eng?eng.n[0]:''} idea`:`Tip: your steps do not mention the ${eng?eng.n[0]:''} idea yet. Words like "${eng?eng.kw.slice(0,3).join('", "'):''}" would show it.`,es:hit?`Tus pasos usan la idea de ${eng?eng.n[1]:''}`:`Consejo: tus pasos todavía no mencionan la idea de ${eng?eng.n[1]:''}. Palabras como "${eng?eng.kw.slice(0,3).join('", "'):''}" la mostrarían.`});
  return out;
}
function textNeeds(){
  const d=S.d, m=[]; const need=(v,n,en,es)=>{ if(len(v)<n) m.push(B(`${en}: ${n-len(v)} more letters.`,`${es}: faltan ${n-len(v)} letras.`)); };
  need(d.name,3,'Game name','Nombre del juego'); need(d.tag,10,'Tagline','Eslogan'); need(d.win,15,'How you win','Cómo se gana'); need(d.algo,20,'Where the algorithm is','Dónde está el algoritmo'); need(d.brk,20,'One way to break it, and your fix','Una forma de romperlo y tu arreglo');
  if(Object.values(d.tests).filter(Boolean).length<2) m.push(B('Pick at least 2 ways you will test your game.','Elige al menos 2 formas de probar tu juego.'));
  if(!d.build) m.push(B('Pick what you plan to build.','Elige qué planeas construir.'));
  return m;
}
const reqOk=()=>algoChecks().filter(c=>!c.tip).every(c=>c.ok);
const canPeer=()=>reqOk()&&textNeeds().length===0;

/* ================= views ================= */
const STEPS=[['design',B('Design','Diseña')],['peer',B('Partner check','Revisión')],['revise',B('Revise','Revisa')],['turnin',B('Turn in','Entregar')]];
const stepKey=()=>S.stage==='design'?(S.rev?'revise':'design'):S.stage;

  return `<ol class="stepper">${STEPS.map((s,i)=>`<li class="${i<idx?'done':i===idx?'now':''}" ${i===idx?'aria-current="step"':''}>${s[1]}</li>`).join('')}</ol>`;}
const needLetters=(n,min)=>n>=min?'':B(`Keep writing: ${min-n} more letters.`,`Sigue escribiendo: faltan ${min-n} letras.`);

function viewWelcome(){return `
  <section class="hero on-dark">
    <h2>${B('Pitch Your Game','Presenta tu juego')}</h2>
    <p class="lead">${B('For the next two weeks you will design a game whose rules ARE an algorithm: a game that sorts, searches, ranks, decides, or predicts. Today you pitch it. A partner will check whether they could play it from your steps, then you improve it.','Durante las próximas dos semanas vas a diseñar un juego cuyas reglas SON un algoritmo: un juego que ordena, busca, clasifica, decide o predice. Hoy lo presentas. Un compañero revisará si podría jugarlo con tus pasos y luego lo mejoras.')}</p>
    <div class="how">
      <div><span class="n">1</span>${B('Pick an algorithm engine and write the rules of one turn.','Elige un motor de algoritmo y escribe las reglas de un turno.')}</div>
      <div><span class="n">2</span>${B('Pass your Chromebook to a partner for a play-it check.','Pásale tu Chromebook a un compañero para una revisión de juego.')}</div>
      <div><span class="n">3</span>${B('Revise, then download your game pitch as a PDF.','Revisa y luego descarga la presentación de tu juego como PDF.')}</div>
    </div>
  </section>
  <section class="card"><h2>${B('Before you start','Antes de empezar')}</h2>
    <div class="fields"><label class="f">${B('Your name','Tu nombre')}<input type="text" id="inName" autocomplete="off" maxlength="60" value="${esc(S.name)}"></label><label class="f">${B('Period','Periodo')}<input type="text" id="inPeriod" autocomplete="off" maxlength="10" value="${esc(S.period)}"></label></div>
    <div class="row" style="margin-top:18px"><button class="btn" id="btnStart" data-act="start" ${S.name.trim().length<2?'disabled':''}>${B('Start designing','Empezar a diseñar')}</button></div></section>`;}

function posterHTML(){
  const d=S.d, pal=PB[d.pal], eng=EB[d.eng], st=stepLines(d.steps), pcs=list(d.pieces);
  return `<div class="poster" id="poster"><div class="band" style="background:${pal.band}"><h3>${esc(d.name.trim()||'Your game name')}</h3><p>${esc(d.tag.trim()||'Your one-line pitch goes here.')}</p></div>
    <div class="body"><div class="tags"><span style="background:${pal.soft};border-color:${pal.acc}"><strong>${eng?B(esc(eng.n[0]),esc(eng.n[1]),'inline'):B('pick an engine','elige un motor','inline')}</strong></span><span>${esc(d.players)} ${B('players','jugadores','inline')}</span></div>
      <div class="sec"><div class="lab">${B('Pieces and data','Piezas y datos','')}</div><div class="tags">${pcs.length?pcs.map(p=>`<span>${esc(p)}</span>`).join(''):'<span>…</span>'}</div></div>
      <div class="sec"><div class="lab">${B('One turn, step by step','Un turno, paso a paso','')}</div><ol class="stepsol">${st.length?st.map(x=>`<li>${esc(x)}</li>`).join(''):'<li>…</li>'}</ol></div>
      <div class="facts"><div class="fact" style="background:${pal.soft}"><div class="lab" style="font-weight:700;font-size:13px">${B('How you win','Cómo se gana','')}</div><div style="font-size:14px;margin-top:4px">${esc(d.win.trim()||'…')}</div></div>
        <div class="fact" style="border:2px solid ${pal.acc}"><div style="font-weight:700;font-size:13px">${B('Where the algorithm is','Dónde está el algoritmo','')}</div><div style="font-size:14px;margin-top:4px">${esc(d.algo.trim()||'…')}</div></div></div>
      <div class="sec"><div class="lab">${B('How it could break, and the fix','Cómo podría romperse y el arreglo','')}</div><div style="font-size:14px">${esc(d.brk.trim()||'…')}</div></div>
      <div class="small">${esc(S.name.trim()||'Your name')}</div></div></div>`;
}
function checksHTML(){
  return `<ul class="checks" id="checks">${algoChecks().map(c=>`<li class="${c.tip?'tip':(c.ok?'ok':'bad')}"><span class="ic">${c.tip?(c.ok?'✓':'!'):(c.ok?'✓':'✗')}</span><span>${B(esc(c.en),esc(c.es))}</span></li>`).join('')}</ul>`;
}
function controlsHTML(){
  const d=S.d, eng=EB[d.eng];
  return `<div style="font-weight:700">${B('1. Pick your algorithm engine','1. Elige tu motor de algoritmo')}</div>
  <div class="engines" id="engines">${ENGINES.map(x=>`<button type="button" data-act="eng" data-id="${x.id}" aria-pressed="${d.eng===x.id}"><div class="nm">${B(esc(x.n[0]),esc(x.n[1]),'inline')}</div><div style="font-size:14px">${B(esc(x.d[0]),esc(x.d[1]))}</div><div class="fr">${B('Like','Como','inline')}: ${B(esc(x.from[0]),esc(x.from[1]),'inline')}</div></button>`).join('')}</div>
  ${eng?`<div class="fb" style="margin-top:10px"><strong>${B('Example','Ejemplo','inline')}:</strong> ${B(esc(eng.ex[0]),esc(eng.ex[1]))}</div>`:''}
  <div class="ctrls" style="margin-top:12px">
    <label>${B('Number of players','Número de jugadores')}<select data-c="players">${['1','2','3','4'].map(n=>`<option ${d.players===n?'selected':''}>${n}</option>`).join('')}</select></label>
    <label>${B('Color theme','Tema de color')}<select data-c="pal">${PAL.map(p=>`<option value="${p.id}" ${d.pal===p.id?'selected':''}>${esc(p.n[0])} / ${esc(p.n[1])}</option>`).join('')}</select></label></div>
  <label class="f">${B('2. Game name','2. Nombre del juego')}<input type="text" data-t="name" maxlength="40" autocomplete="off" value="${esc(d.name)}"></label>
  <label class="f">${B('One-line pitch (tagline)','Presentación de una línea (eslogan)')}<input type="text" data-t="tag" maxlength="90" autocomplete="off" value="${esc(d.tag)}"></label>
  <label class="f">${B('3. Pieces and data (4 or more, separated by commas)','3. Piezas y datos (4 o más, separados por comas)')}<input type="text" data-t="pieces" maxlength="200" autocomplete="off" value="${esc(d.pieces)}" placeholder="8 number cards, a timer, a score sheet, 2 dice"></label>
  <label class="f">${B('4. One turn, step by step (one step per line, 4 to 10 steps)','4. Un turno, paso a paso (un paso por línea, de 4 a 10 pasos)')}<textarea data-t="steps" maxlength="900" style="min-height:150px" placeholder="1. Draw a card.&#10;2. If it is higher than the middle card, play it right.&#10;3. Otherwise play it left.&#10;4. Repeat until the cards are in order.">${esc(d.steps)}</textarea></label>
  <label class="f">${B('5. How do you win?','5. ¿Cómo se gana?')}<input type="text" data-t="win" maxlength="160" autocomplete="off" value="${esc(d.win)}"></label>
  <label class="f">${B('6. Where is the algorithm? Which step, and why is it an algorithm?','6. ¿Dónde está el algoritmo? ¿Qué paso y por qué es un algoritmo?')}<textarea data-t="algo" maxlength="220" style="min-height:70px">${esc(d.algo)}</textarea></label>
  <label class="f">${B('7. One way a player could cheat or break the rules, and your fix','7. Una forma en que un jugador podría hacer trampa o romper las reglas, y tu arreglo')}<textarea data-t="brk" maxlength="220" style="min-height:70px">${esc(d.brk)}</textarea></label>
  <div style="font-weight:700;margin-top:12px">${B('8. How will you test it? (pick at least 2)','8. ¿Cómo lo probarás? (elige al menos 2)')}</div>
  ${TESTS.map(t=>`<label style="display:flex;gap:8px;align-items:center;margin:4px 0"><input type="checkbox" data-test="${t[0]}" ${d.tests[t[0]]?'checked':''} style="width:20px;height:20px"> ${B(esc(t[1]),esc(t[2]),'inline')}</label>`).join('')}
  <label class="f">${B('9. What will you build over the next two weeks?','9. ¿Qué construirás durante las próximas dos semanas?')}<select data-c="build"><option value="">${esc('Pick one / Elige uno')}</option>${BUILDS.map(b=>`<option value="${b[0]}" ${d.build===b[0]?'selected':''}>${esc(b[1])} / ${esc(b[2])}</option>`).join('')}</select></label>`;
}
function designNeedHTML(){
  const bad=algoChecks().filter(c=>!c.tip&&!c.ok), m=textNeeds(); let h='';
  if(bad.length) h+=`<div>${B('Still needed: ','Todavía falta: ','inline')}${bad.map(c=>B(esc(c.en),esc(c.es),'inline')).join('; ')}</div>`;
  if(m.length) h+=`<div style="margin-top:6px">${m.join('<br>')}</div>`;
  if(S.rev&&len(S.change)<20) h+=`<div style="margin-top:6px">${B('What I changed or why I kept it: ','Qué cambié o por qué lo dejé: ','inline')}${needLetters(len(S.change),20)}</div>`;
  return h;
}
function viewDesign(){
  const ready=canPeer()&&(!S.rev||len(S.change)>=20);
  const fb=S.rev?`<section class="card"><h2 style="font-size:20px">${B('Your partner\'s play-it check','La revisión de juego de tu compañero')}</h2><p style="margin:0 0 6px">${B('From','De','inline')}: <strong>${esc(S.peer.name)}</strong></p>${PQ.map((q,i)=>{const a=PA.find(z=>z[0]===S.peer.a[i])||PA[2]; return `<div style="margin:4px 0">${B(esc(q[0]),esc(q[1]))} <strong>→ ${B(esc(a[1]),esc(a[2]),'inline')}</strong></div>`;}).join('')}<div class="fb">${B('Suggestion: ','Sugerencia: ','inline')}${esc(S.peer.sug)}</div>
      <label class="f">${B('What I changed, or why I kept it the same','Qué cambié, o por qué lo dejé igual')}<textarea id="inChange" style="min-height:80px" placeholder="I changed… because… / Cambié… porque…">${esc(S.change)}</textarea></label></section>`:'';
  return `${stepper()}
  <section class="card" style="margin-top:12px"><h2>${S.rev?B('Revise your game','Mejora tu juego'):B('Design your game','Diseña tu juego')}</h2>
    <p class="lead">${S.rev?B('Use your partner\'s check to make the rules clearer. Every required check still has to pass.','Usa la revisión de tu compañero para aclarar las reglas. Todas las revisiones obligatorias deben seguir en verde.'):B('A good algorithm game has clear steps, at least one decision, and a repeat. Fill in the nine parts. The checks on the right update as you write.','Un buen juego de algoritmo tiene pasos claros, al menos una decisión y una repetición. Llena las nueve partes. Las revisiones de la derecha se actualizan mientras escribes.')}</p></section>
  ${fb}
  <div class="two2"><section class="card" style="margin-top:16px"><h3 style="font-size:19px;margin-bottom:6px">${B('Your game pitch','La presentación de tu juego')}</h3><div id="posterbox">${posterHTML()}</div></section>
    <section class="card" style="margin-top:16px"><h3 style="font-size:19px;margin-bottom:6px">${B('Algorithm check','Revisión del algoritmo')}</h3><div id="checkbox">${checksHTML()}</div><div id="ctrlbox" style="margin-top:12px">${controlsHTML()}</div></section></div>
  <section class="card"><div class="msg warn" id="designneed">${ready?'':designNeedHTML()}</div>
    <div class="row" style="margin-top:10px"><button class="btn" id="btnNext" data-act="${S.rev?'toturnin':'topeer'}" ${ready?'':'disabled'}>${S.rev?B('Go to turn in','Ir a entregar'):B('Ready for a partner check','Lista para la revisión del compañero')}</button></div></section>`;
}
function peerNeed(){
  const P=S.peer, m=[]; if(len(P.name)<2) m.push(B('Partner: type your name.','Compañero: escribe tu nombre.'));
  const left=P.a.filter(x=>!x).length; if(left) m.push(B(`Answer all four questions (${left} left).`,`Responde las cuatro preguntas (faltan ${left}).`));
  if(len(P.sug)<10) m.push(B(`Suggestion: ${10-len(P.sug)} more letters.`,`Sugerencia: faltan ${10-len(P.sug)} letras.`));
  return m;
}
function viewPeer(){
  const P=S.peer, m=peerNeed();
  return `${stepper()}
  <section class="card" style="margin-top:12px"><h2>${B('Partner check: could you play it?','Revisión del compañero: ¿podrías jugarlo?')}</h2>
    <p class="lead">${B('Pass the Chromebook to your partner. Partner: read the steps and try to play the game in your head. Answer the four questions honestly. You are checking the rules, not the person.','Pásale el Chromebook a tu compañero. Compañero: lee los pasos e intenta jugar el juego en tu mente. Responde las cuatro preguntas con honestidad. Estás revisando las reglas, no a la persona.')}</p></section>
  <div class="two2"><section class="card" style="margin-top:16px">${posterHTML()}</section>
    <section class="card" style="margin-top:16px"><label class="f" style="margin-top:0">${B('Partner\'s name','Nombre del compañero')}<input type="text" id="inPeerName" maxlength="60" autocomplete="off" value="${esc(P.name)}"></label>
      ${PQ.map((q,i)=>`<div class="qrow"><div>${i+1}. ${B(esc(q[0]),esc(q[1]))}</div><div class="opts2">${PA.map(a=>`<button type="button" data-act="pa" data-i="${i}" data-v="${a[0]}" aria-pressed="${P.a[i]===a[0]}">${B(esc(a[1]),esc(a[2]),'inline')}</button>`).join('')}</div></div>`).join('')}
      <label class="f">${B('One thing I would change or add','Una cosa que cambiaría o agregaría')}<textarea id="inSug" style="min-height:70px">${esc(P.sug)}</textarea></label>
      <div class="msg warn" id="peerneed" style="margin-top:8px">${m.join('<br>')}</div>
      <div class="row" style="margin-top:10px"><button class="btn" id="btnPeerDone" data-act="peerdone" ${m.length?'disabled':''}>${B('Done: give it back','Listo: devuélvelo')}</button><button class="btn ghost" data-act="backdesign">${B('Back to my design','Volver a mi diseño')}</button></div></section></div>`;
}

/* ---- PDF ---- */
function PDFNAME(){return 'U4L12_PitchYourGame_'+PDFLIB.fold(S.name)+'.pdf';}
function buildPDF(){
  const d=PDFLIB.doc(), D=S.d, pal=PB[D.pal], eng=EB[D.eng]; const bw=d.W-2*d.M, top=d.M;
  const hl=d.wrap(D.name.trim(),'F2',26,bw-28), sl=d.wrap(D.tag.trim(),'F1',12,bw-28), bh=16+hl.length*30+sl.length*15+14;
  d.box(d.M,top,bw,bh,10,hex(pal.band)); let y=top+16+22; hl.forEach(l=>{d.text(l,d.M+14,y,'F2',26,PDFLIB.WHITE); y+=30;}); y-=6; sl.forEach(l=>{d.text(l,d.M+14,y+8,'F1',12,PDFLIB.WHITE); y+=15;});
  d.setY(top+bh+12);
  const lab=(en,es)=>d.para(en+' / '+es,{font:'F2',size:10,color:hex(pal.band)});
  d.para('Engine / Motor: '+eng.n[0]+' / '+eng.n[1]+'     Players / Jugadores: '+D.players,{font:'F2',size:11});
  lab('PIECES AND DATA','PIEZAS Y DATOS'); d.para(list(D.pieces).join(', '),{size:10.5});
  lab('ONE TURN, STEP BY STEP','UN TURNO, PASO A PASO'); stepLines(D.steps).forEach((s,i)=>d.para((i+1)+'.  '+s,{size:10.5,indent:8}));
  lab('HOW YOU WIN','CÓMO SE GANA'); d.para(D.win.trim(),{size:10.5});
  lab('WHERE THE ALGORITHM IS','DÓNDE ESTÁ EL ALGORITMO'); d.para(D.algo.trim(),{size:10.5});
  lab('HOW IT COULD BREAK, AND THE FIX','CÓMO PODRÍA ROMPERSE Y EL ARREGLO'); d.para(D.brk.trim(),{size:10.5});
  d.para('Made by '+S.name.trim()+', period '+(S.period.trim()||'—'),{size:9,color:PDFLIB.GRAY});
  d.newPage(); d.title('Game pitch: the process','Unit 4 · Lesson 12   /   Unidad 4 · Lección 12');
  d.kv('Name / Nombre',S.name.trim()); d.kv('Period / Periodo',S.period.trim()||'—'); d.kv('Date / Fecha',new Date().toLocaleString());
  d.heading('Algorithm check (final version)','Revisión del algoritmo (versión final)');
  algoChecks().forEach(c=>d.line((c.tip?(c.ok?'[OK]  ':'[TIP]  '):(c.ok?'[PASS]  ':'[FAIL]  '))+c.en+' / '+c.es,{size:10}));
  d.heading('Partner check','Revisión del compañero'); d.line('Partner / Compañero: '+S.peer.name.trim());
  PQ.forEach((q,i)=>{const a=PA.find(z=>z[0]===S.peer.a[i])||PA[2]; d.line((i+1)+'. '+q[0]+' / '+q[1]+'   ->   '+a[1]+' / '+a[2],{size:10});});
  d.para('Suggestion / Sugerencia: '+S.peer.sug.trim());
  d.heading('What I changed, or why I kept it','Qué cambié, o por qué lo dejé'); d.para(S.change.trim()||'—');
  d.heading('Test plan and build plan','Plan de pruebas y plan de construcción');
  Object.keys(D.tests).filter(k=>D.tests[k]).forEach(k=>d.line('[x]  '+TB[k][1]+' / '+TB[k][2],{size:10}));
  d.line('Build plan / Plan de construcción: '+(BLD[D.build]?BLD[D.build][1]+' / '+BLD[D.build][2]:'—'),{size:10});
  return d.build('Pitch Your Game - '+S.name.trim());
}
function summary(){
  const D=S.d, eng=EB[D.eng], L=['PITCH YOUR GAME — Unit 4, Lesson 12','Name: '+S.name.trim()+'   Period: '+(S.period.trim()||'—'),'Date: '+new Date().toLocaleString(),'',
   'GAME: '+D.name.trim(),'TAGLINE: '+D.tag.trim(),'ENGINE: '+(eng?eng.n[0]:'—')+'   PLAYERS: '+D.players,'PIECES: '+list(D.pieces).join(', '),'','ONE TURN:'];
  stepLines(D.steps).forEach((s,i)=>L.push((i+1)+'. '+s)); L.push('','WIN: '+D.win.trim(),'WHERE THE ALGORITHM IS: '+D.algo.trim(),'HOW IT COULD BREAK AND THE FIX: '+D.brk.trim(),'');
  algoChecks().forEach(c=>L.push((c.tip?'TIP ':(c.ok?'PASS ':'FAIL '))+c.en));
  L.push('','PARTNER: '+S.peer.name.trim()); PQ.forEach((q,i)=>L.push((i+1)+'. '+q[0]+' -> '+((PA.find(z=>z[0]===S.peer.a[i])||PA[2])[1]))); L.push('Suggestion: '+S.peer.sug.trim(),'','WHAT I CHANGED OR WHY I KEPT IT:',S.change.trim(),'','TESTS: '+Object.keys(D.tests).filter(k=>D.tests[k]).map(k=>TB[k][1]).join('; '),'BUILD: '+(BLD[D.build]?BLD[D.build][1]:'—')); return L.join('\n');
}
function doPDF(){
  const m=$('#pdfmsg');
  try{ PDFLIB.download(buildPDF(),PDFNAME()); m.innerHTML=B('Saved! Now upload the PDF to Canvas.','¡Guardado! Ahora sube el PDF a Canvas.','inline'); }
  catch(err){ m.innerHTML=B('The PDF did not work. Use "Copy as text" below.','El PDF no funcionó. Usa "Copiar como texto" abajo.','inline'); const dt=document.querySelector('details'); if(dt) dt.open=true; }
}
function viewTurnin(){return `${stepper()}
  <section class="card"><h2>${B('Turn it in','Entrégalo')}</h2>
    <ol style="padding-left:22px;margin:8px 0 0">
      <li style="margin-bottom:8px">${B('Press Download my PDF. Page 1 is your game pitch.','Presiona Descargar mi PDF. La página 1 es la presentación de tu juego.')}</li>
      <li style="margin-bottom:8px">${B('Open the Canvas assignment and choose File Upload.','Abre la tarea en Canvas y elige Subir archivo.')}</li>
      <li>${B('Upload the PDF, then press Submit.','Sube el PDF y presiona Enviar.')}</li></ol>
    <div class="row" style="margin-top:14px"><button class="btn" id="btnPdf" data-act="pdf">${B('Download my PDF','Descargar mi PDF')}</button><button class="btn ghost" data-act="backrev">${B('Back to revise','Volver a revisar')}</button><span id="pdfmsg" class="copied" role="status"></span></div>
    <details style="margin-top:16px"><summary style="cursor:pointer">${B('Trouble downloading? Copy as text instead','¿Problemas para descargar? Copia como texto')}</summary>
      <textarea id="sumbox" class="sumbox" readonly aria-label="Summary" style="margin-top:10px">${esc(summary())}</textarea>
      <div class="row" style="margin-top:10px"><button class="btn ghost" data-act="copy">${B('Copy as text','Copiar como texto')}</button><span id="copymsg" class="copied" role="status"></span></div></details></section>
  <section class="card"><h3 style="font-size:19px;margin-bottom:8px">${B('Your game pitch','La presentación de tu juego')}</h3>${posterHTML()}</section>
  <button class="reset" data-act="reset">${B('Start over (clears this device)','Empezar de nuevo (borra este dispositivo)','inline')}</button>`;}

/* ================= render + actions ================= */
function render(){
  document.body.setAttribute('data-lang',S.lang); document.documentElement.lang=S.lang;
  document.querySelectorAll('.langtog button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===S.lang));
  const v={welcome:viewWelcome,design:viewDesign,peer:viewPeer,turnin:viewTurnin}[S.stage];
  $('#app').innerHTML=v(); save();
}
function go(st){S.stage=st; render(); window.scrollTo(0,0);}
function liveDesign(){
  $('#posterbox').innerHTML=posterHTML(); $('#checkbox').innerHTML=checksHTML();
  const ready=canPeer()&&(!S.rev||len(S.change)>=20); const n=$('#designneed'); if(n) n.innerHTML=ready?'':designNeedHTML(); const b=$('#btnNext'); if(b) b.disabled=!ready; save();
}
document.addEventListener('input',e=>{
  const t=e.target,id=t.id;
  if(t.dataset&&t.dataset.t&&S.stage==='design'){ S.d[t.dataset.t]=t.value; liveDesign(); return; }
  if(id==='inName'){S.name=t.value; save(); const b=$('#btnStart'); if(b) b.disabled=S.name.trim().length<2;}
  else if(id==='inPeriod'){S.period=t.value; save();}
  else if(id==='inChange'){S.change=t.value; liveDesign();}
  else if(id==='inPeerName'){S.peer.name=t.value; peerRefresh();}
  else if(id==='inSug'){S.peer.sug=t.value; peerRefresh();}
});
function peerRefresh(){const m=peerNeed(); const n=$('#peerneed'); if(n) n.innerHTML=m.join('<br>'); const b=$('#btnPeerDone'); if(b) b.disabled=m.length>0; save();}
document.addEventListener('change',e=>{
  const t=e.target; if(S.stage!=='design') return;
  if(t.dataset&&t.dataset.test){ S.d.tests[t.dataset.test]=t.checked; liveDesign(); return; }
  if(t.dataset&&t.dataset.c&&t.tagName==='SELECT'){ S.d[t.dataset.c]=t.value; liveDesign(); return; }
});
function doCopy(){
  const ta=$('#sumbox'); ta.value=summary(); const m=$('#copymsg');
  const ok=()=>{m.innerHTML=B('Copied! Now paste it into Canvas.','¡Copiado! Ahora pégalo en Canvas.','inline');};
  const fb=()=>{ta.focus();ta.select();try{document.execCommand('copy');ok();}catch(x){m.innerHTML=B('Select the text and press Ctrl+C.','Selecciona el texto y presiona Ctrl+C.','inline');}};
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(ok,fb); else fb();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t||t.disabled) return; const a=t.dataset.act;
  if(a==='lang'){S.lang=t.dataset.l; render();}
  else if(a==='start'){ if(S.name.trim().length>=2) go('design'); }
  else if(a==='eng'){ S.d.eng=t.dataset.id; const cb=$('#ctrlbox'); const y=window.scrollY; render(); window.scrollTo(0,y); }
  else if(a==='topeer'){ if(canPeer()) go('peer'); }
  else if(a==='backdesign'){ go('design'); }
  else if(a==='pa'){ S.peer.a[+t.dataset.i]=t.dataset.v; render(); }
  else if(a==='peerdone'){ if(peerNeed().length===0){ S.peerDone=true; S.rev=true; go('design'); } }
  else if(a==='toturnin'){ if(canPeer()&&len(S.change)>=20) go('turnin'); }
  else if(a==='backrev'){ go('design'); }
  else if(a==='pdf') doPDF();
  else if(a==='copy') doCopy();
  else if(a==='reset'){ if(confirm('Start over? This clears your work on this device. / ¿Empezar de nuevo? Esto borra tu trabajo en este dispositivo.')){try{localStorage.removeItem(KEY);}catch(x){} S=fresh(); render();} }
});

S=load();
if(!['welcome','design','peer','turnin'].includes(S.stage)) S.stage='welcome';
if(S.stage==='turnin'&&!(S.peerDone&&canPeer()&&len(S.change)>=20)) S.stage='design';
if(S.stage==='peer'&&!canPeer()) S.stage='design';
render();
window.__S=()=>S; window.__H={checks:algoChecks,needs:textNeeds,ENGINES:ENGINES,stepLines:stepLines,list:list};
})();

</script>
</body>
</html>
